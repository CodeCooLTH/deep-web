<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Command Center — Mockup V1</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f4f5f7; --blue:#2563eb; --ink:#1e2939; --muted:#6b7280; }
  * { font-family:'Anuphan',sans-serif; -webkit-tap-highlight-color:transparent; }
  body { background:var(--bg); margin:0; }
  .card { background:#fff; border-radius:1rem; box-shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04); }
  .tile { transition:transform .08s ease; }
  .tile:active { transform:scale(.97); }
  .ic { display:inline-flex; align-items:center; justify-content:center; }
</style>
</head>
<body>
<div class="max-w-[480px] mx-auto min-h-screen pb-8">

  <!-- TOP BAR -->
  <header class="card !rounded-2xl m-3 px-4 py-3 flex items-center justify-between sticky top-3 z-10">
    <button class="ic w-11 h-11 rounded-xl bg-[var(--blue)] text-white">
      <span class="iconify text-2xl" data-icon="tabler:menu-2"></span>
    </button>
    <div class="flex items-center gap-3">
      <button class="ic w-11 h-11 rounded-xl bg-gray-50 text-gray-600 relative">
        <span class="iconify text-2xl" data-icon="tabler:bell"></span>
        <span class="absolute top-1.5 right-1.5 w-5 h-5 text-[11px] font-semibold bg-red-500 text-white rounded-full ic">5</span>
      </button>
      <img src="https://i.pravatar.cc/80?img=12" class="w-11 h-11 rounded-xl object-cover" alt="avatar">
    </div>
  </header>

  <!-- GREETING -->
  <section class="mx-3 mb-3 px-4 py-3 card flex items-center justify-between">
    <div class="min-w-0">
      <p class="text-[13px] text-[var(--muted)]">ยินดีต้อนรับ,</p>
      <h1 class="text-[17px] font-700 text-[var(--ink)] truncate leading-snug">BT premium auto xenon สาขา สุขสวัสดิ์</h1>
    </div>
    <div class="shrink-0 text-center pl-3">
      <div class="text-[22px] font-700 text-[var(--blue)] leading-none">65</div>
      <div class="text-[11px] text-[var(--muted)] mt-0.5">Trust</div>
    </div>
  </section>

  <!-- HERO STATUS+ACTION -->
  <section class="mx-3 mb-3 grid grid-cols-2 gap-3">
    <a class="tile card p-4 flex flex-col gap-3 active:bg-gray-50">
      <span class="ic w-12 h-12 rounded-2xl bg-blue-50 text-[var(--blue)]"><span class="iconify text-[26px]" data-icon="tabler:shopping-cart"></span></span>
      <div>
        <div class="flex items-end gap-1.5"><span class="text-[28px] font-700 text-[var(--ink)] leading-none">3</span><span class="text-[13px] text-[var(--muted)] mb-0.5">รอดำเนินการ</span></div>
        <p class="text-[14px] font-600 text-[var(--ink)] mt-1">คำสั่งซื้อ</p>
      </div>
    </a>
    <a class="tile card p-4 flex flex-col gap-3 active:bg-gray-50">
      <span class="ic w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600"><span class="iconify text-[26px]" data-icon="tabler:wallet"></span></span>
      <div>
        <div class="flex items-end gap-1"><span class="text-[24px] font-700 text-[var(--ink)] leading-none">฿16,900</span></div>
        <p class="text-[14px] font-600 text-[var(--ink)] mt-1">เติมเงิน / เครดิต SMS</p>
      </div>
    </a>
  </section>

  <!-- PRIMARY CTA -->
  <section class="mx-3 mb-3">
    <a class="tile flex items-center justify-center gap-2 w-full h-14 rounded-2xl bg-[var(--blue)] text-white font-600 text-[16px] shadow-sm active:opacity-90">
      <span class="iconify text-2xl" data-icon="tabler:plus"></span> สร้างออเดอร์
    </a>
  </section>

  <!-- QUICK ACCESS GRID -->
  <section class="mx-3">
    <p class="text-[13px] font-600 text-[var(--muted)] px-1 mb-2">เมนูร้านค้า</p>
    <div class="grid grid-cols-3 gap-3">
      <!-- tile template -->
      <a class="tile card p-3 flex flex-col items-center gap-2 text-center active:bg-gray-50">
        <span class="ic w-12 h-12 rounded-2xl bg-indigo-50 text-indigo-600"><span class="iconify text-[24px]" data-icon="tabler:package"></span></span>
        <span class="text-[13px] font-600 text-[var(--ink)] leading-tight">สินค้า</span>
        <span class="text-[12px] text-[var(--muted)] -mt-1">24 รายการ</span>
      </a>
      <a class="tile card p-3 flex flex-col items-center gap-2 text-center active:bg-gray-50">
        <span class="ic w-12 h-12 rounded-2xl bg-amber-50 text-amber-600"><span class="iconify text-[24px]" data-icon="tabler:category"></span></span>
        <span class="text-[13px] font-600 text-[var(--ink)] leading-tight">หมวดหมู่</span>
        <span class="text-[12px] text-[var(--muted)] -mt-1">6 หมวด</span>
      </a>
      <a class="tile card p-3 flex flex-col items-center gap-2 text-center active:bg-gray-50">
        <span class="ic w-12 h-12 rounded-2xl bg-sky-50 text-sky-600"><span class="iconify text-[24px]" data-icon="tabler:users"></span></span>
        <span class="text-[13px] font-600 text-[var(--ink)] leading-tight">ลูกค้า</span>
        <span class="text-[12px] text-[var(--muted)] -mt-1">12 คน</span>
      </a>
      <a class="tile card p-3 flex flex-col items-center gap-2 text-center active:bg-gray-50">
        <span class="ic w-12 h-12 rounded-2xl bg-yellow-50 text-yellow-600"><span class="iconify text-[24px]" data-icon="tabler:star"></span></span>
        <span class="text-[13px] font-600 text-[var(--ink)] leading-tight">รีวิว</span>
        <span class="text-[12px] text-[var(--muted)] -mt-1">4.8 ★</span>
      </a>
      <a class="tile card p-3 flex flex-col items-center gap-2 text-center active:bg-gray-50">
        <span class="ic w-12 h-12 rounded-2xl bg-green-50 text-green-600"><span class="iconify text-[24px]" data-icon="tabler:shield-check"></span></span>
        <span class="text-[13px] font-600 text-[var(--ink)] leading-tight">ยืนยันตัวตน</span>
        <span class="text-[12px] text-green-600 font-600 -mt-1">L2 ✓</span>
      </a>
      <a class="tile card p-3 flex flex-col items-center gap-2 text-center active:bg-gray-50">
        <span class="ic w-12 h-12 rounded-2xl bg-gray-100 text-gray-600"><span class="iconify text-[24px]" data-icon="tabler:settings"></span></span>
        <span class="text-[13px] font-600 text-[var(--ink)] leading-tight">ตั้งค่าร้าน</span>
        <span class="text-[12px] text-[var(--muted)] -mt-1">จัดการ</span>
      </a>
    </div>
  </section>

  <!-- mini link to full report -->
  <section class="mx-3 mt-4">
    <a class="flex items-center justify-center gap-1.5 text-[14px] font-600 text-[var(--blue)] py-2">
      ดูรายงานยอดขายแบบเต็ม <span class="iconify text-lg" data-icon="tabler:arrow-right"></span>
    </a>
  </section>

</div>
</body>
</html>
