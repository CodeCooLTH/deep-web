<script>
// ---------- ตัวช่วย ----------
const IC = (n, s = 12, c = '') => `<iconify-icon icon="tabler:${n}" width="${s}" height="${s}" class="${c}" aria-hidden="true"></iconify-icon>`
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;')
const DEVS = [
  { k: 'm', w: 390, label: 'Mobile 390' },
  { k: 't', w: 834, label: 'Tablet 834' },
  { k: 'd', w: 1440, label: 'Desktop 1440' },
]
// รูปโปรไฟล์จำลอง (SVG ในไฟล์ ไม่โหลดจากเน็ต)
function photo(h) {
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='hsl(${h},55%,62%)'/><stop offset='1' stop-color='hsl(${(h + 40) % 360},50%,42%)'/></linearGradient></defs><rect width='40' height='40' fill='url(#g)'/><circle cx='20' cy='16' r='7' fill='hsl(${h},40%,88%)'/><ellipse cx='20' cy='37' rx='13' ry='10' fill='hsl(${h},40%,88%)'/></svg>`
  return 'data:image/svg+xml,' + encodeURIComponent(svg)
}
const initials = (n) => n.trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join('')

// ขอบรูป: outline-2 outline-offset-2 outline-purple (TW4 outline-2 ใส่ style solid ให้เอง · TW3 CDN ต้องมี `outline`)
const RING = 'outline outline-2 outline-offset-2 outline-purple'
function avatar({ img, name, ring, size = 'size-10', fail }) {
  if (!img || fail)
    return `<span class="bg-primary10 text-primary flex ${size} shrink-0 items-center justify-center rounded-full text-sm font-semibold ${ring ? RING : ''}">${esc(initials(name))}</span>`
  return `<img src="${img}" alt="${esc(name)}" class="${size} shrink-0 rounded-full bg-d100 object-cover ${ring ? RING : ''}">`
}
// จานมุมบนขวา — ในแถวเป็น aria-hidden (มีชิปข้อความอ่านซ้ำแล้ว) · หัวห้อง/แผงเป็น role=img
// รอบ 2: ใหม่ = รถเข็น · ซื้อซ้ำ = ตัวเลขจำนวนใบ (เกิน 9 = 9+) · role=img ทุกจุด (แถวไม่มีชิปข้อความแล้ว)
function cornerDisc(o) {
  const isNew = o.customer === 'new'
  const label = isNew ? 'ลูกค้าใหม่ ซื้อแล้ว 1 คำสั่งซื้อ' : `ลูกค้าซื้อซ้ำ ซื้อแล้ว ${o.n} คำสั่งซื้อ`
  const inner = isNew ? IC('shopping-cart', 10, 'text-white') : `<span class="text-[10px] font-bold leading-none text-white">${o.n > 9 ? '9+' : o.n}</span>`
  const dim = isNew || o.n <= 9 ? 'size-4' : 'h-4 min-w-4 px-0.5'
  return `<span role="img" aria-label="${label}" title="${label}" class="absolute -end-0.5 -top-0.5 flex ${dim} items-center justify-center rounded-full bg-purple ring-2" style="--tw-ring-color:var(--card)">${inner}</span>`
}
const CH = {
  MESSENGER: { label: 'Messenger', html: `<iconify-icon icon="logos:messenger" width="16" height="16"></iconify-icon>` },
  INSTAGRAM: { label: 'Instagram', html: `<iconify-icon icon="skill-icons:instagram" width="16" height="16"></iconify-icon>` },
  LINE: { label: 'LINE', html: `<span class="flex size-full items-center justify-center" style="background:#06c755"><iconify-icon icon="tabler:brand-line" width="11" height="11" style="color:#fff"></iconify-icon></span>` },
}
const channelOverlay = (ch) =>
  `<span title="${CH[ch].label}" class="absolute -end-0.5 -bottom-0.5 block size-4 overflow-hidden rounded-full bg-card ring-2" style="--tw-ring-color:var(--card)">${CH[ch].html}</span>`
function avatarBlock(o, semantic, size) {
  return `<span class="relative shrink-0">${avatar({ img: o.img, name: o.name, ring: !!o.customer, size, fail: o.imgFail })}${o.customer ? cornerDisc(o) : ''}${channelOverlay(o.ch)}</span>`
}

// ---------- จุดที่ 1: แถวรายการห้อง ----------
const LONG_NAME = 'BT Premium Auto Xenon คลอง4 ธัญบุรี'
const LONG_PREVIEW = 'สนใจชุดไฟ Xenon รุ่นใหม่ติดตั้งที่ธัญบุรีได้ไหมคะ ราคารวมค่าแรงเท่าไหร่ แล้วต้องจองคิวล่วงหน้ากี่วัน'
const ROWS = [
  { id: 'R1', note: 'พื้นฐาน ไม่มีสัญญาณ', name: 'นภัสสร ใจดี', img: photo(200), ch: 'MESSENGER', preview: 'ขอบคุณค่ะ ได้รับของแล้วนะคะ', time: '10:24' },
  { id: 'R2', note: 'ลูกค้าใหม่', name: 'กิตติพงษ์ ศรีสุข', img: photo(30), ch: 'LINE', preview: 'ส่งของวันไหนครับ', time: '09:58', customer: 'new', unread: 1 },
  { id: 'R3', note: 'ลูกค้าซื้อซ้ำ', name: 'วรรณา พรหมมา', img: photo(320), ch: 'INSTAGRAM', you: true, preview: 'ได้เลยค่ะ เดี๋ยวแพ็กให้วันนี้', time: '09:41', customer: 'repeat', n: 4 },
  { id: 'R4', note: 'Meta AI อย่างเดียว (ยังไม่เป็นลูกค้า)', name: 'Somchai K.', img: photo(140), ch: 'MESSENGER', preview: 'มีสีดำไหมครับ', time: '09:30', metaAi: true },
  { id: 'R5', note: 'เลวร้ายสุด: ปักหมุด + ทุกป้าย', name: LONG_NAME, img: photo(260), ch: 'MESSENGER', you: true, preview: LONG_PREVIEW, time: 'เมื่อวาน',
    pinned: true, unread: 12, draft: 2, follow: 3, metaAi: true, customer: 'repeat', n: 3, returned: 2, deepbot: true, interested: true,
    adId: '120210987654321', tag: 'ลูกค้าประจำย่านธัญบุรีรังสิตคลองหลวง', folder: 'ลูกค้าติดตั้งไฟหน้ารถยนต์', stage: 'พัสดุมีปัญหา ×2',
    urgent: { when: 'เลย 2 วัน', title: 'โทรยืนยันที่อยู่ติดตั้ง', more: 1 } },
  null, // R6 = R3 ตอนเลือกอยู่ (ตั้งค่าข้างล่าง)
  { id: 'R7', note: 'ปิดงานแล้ว + ลูกค้า', name: 'ประภาพร มั่นคง', img: photo(90), ch: 'MESSENGER', you: true, preview: 'ขอบคุณที่อุดหนุนค่ะ', time: 'จ.', customer: 'repeat', n: 12, resolved: true },
  { id: 'R8', note: 'รูปโหลดพลาด (ตัวอักษรย่อมีขอบ)', name: 'ธนากร วงศ์ใหญ่', img: photo(10), imgFail: true, ch: 'LINE', preview: 'โอนแล้วครับ', time: '12 ต.ค.', customer: 'new' },
]
ROWS[5] = { ...ROWS[2], id: 'R6', note: 'เลือกอยู่ (active) บน R3', active: true }

function rowChips(o) {
  // รอบ 2: สูงสุด 2 ใบ + "+N" ทุกจอ · ลำดับ ติดตาม → ตีกลับ/ยกเลิก → DeepBot → สถานะขาย → ad_id → แท็ก
  // ลูกค้าใหม่/ซื้อซ้ำ ย้ายไปจานมุมรูป · Meta AI ย้ายไปไอคอนหน้าเวลา
  const c = []
  if (o.follow) c.push({ l: `ติดตาม ${o.follow}`, h: `<span role="img" aria-label="ติดตาม ${o.follow} รายการ" title="ติดตาม ${o.follow} รายการ" class="badge bg-success15 text-success-ink">${IC('star', 12)}ติดตาม ${o.follow}</span>` })
  if (o.returned) c.push({ l: `ตีกลับ ${o.returned} รายการ`, h: `<span role="img" aria-label="ตีกลับ ${o.returned} รายการ" title="ตีกลับ ${o.returned} รายการ" class="badge max-w-32 shrink-0 bg-warning15 text-warning-ink">${IC('arrow-back-up', 12)}<span class="truncate">ตีกลับ ${o.returned} รายการ</span></span>` })
  if (o.deepbot) c.push({ l: 'DeepBot', h: `<span class="badge bg-primary15 text-primary-ink">${IC('robot', 12)}DeepBot</span>` })
  if (o.interested) c.push({ l: 'สนใจ', h: `<span class="badge bg-success15 text-success">สนใจ</span>` })
  if (o.adId) c.push({ l: `ad_id.${o.adId}`, h: `<span title="ad_id.${o.adId}" class="badge max-w-24 bg-d100 text-d600">${IC('brand-meta', 12)}<span class="truncate">ad_id.${o.adId}</span></span>` })
  if (o.tag) c.push({ l: o.tag, h: `<span title="${o.tag}" class="badge max-w-28 bg-primary15 text-primary-ink"><span class="truncate">${o.tag}</span></span>` })
  if (!c.length) return ''
  const hidden = c.slice(2)
  const plus = hidden.length
    ? `<span role="img" aria-label="ป้ายอื่นอีก ${hidden.length} รายการ: ${hidden.map((x) => x.l).join(', ')}" title="${hidden.map((x) => x.l).join(' · ')}" class="badge bg-d100 text-d700">+${hidden.length}</span>`
    : ''
  return `<span class="mt-1 flex flex-wrap items-center gap-1">${c.slice(0, 2).map((x) => x.h).join('')}${plus}</span>`
}
function inboxRow(o) {
  const st = o.active ? 'border-primary bg-row-active' : o.pinned ? 'border-warning bg-row-pinned' : 'border-transparent bg-card'
  const unread = !!o.unread
  return `
  <div class="relative flex items-stretch border-s-2 ${st}" data-row="${o.id}">
    <span class="absolute -start-0.5 top-1 z-10 rounded-e bg-d900 px-1 text-[9px] font-bold leading-4 text-card" title="${o.note}">${o.id}</span>
    <div class="flex min-w-0 flex-1 justify-between gap-3 py-3 pe-3.75 ps-3.75">
      <div class="flex min-w-0 flex-1 items-center gap-3">
        ${avatarBlock(o, false, 'size-10')}
        <span class="min-w-0 flex-1 overflow-hidden text-start">
          <span class="flex items-center gap-1 truncate text-xs text-d900 ${unread ? 'font-bold' : 'font-semibold'}">
            ${o.pinned ? IC('star-filled', 14, 'text-warning') : ''}
            ${o.resolved ? IC('circle-check', 14, 'text-success') : ''}
            <span class="truncate">${esc(o.name)}</span>
          </span>
          <span class="block truncate text-xs ${unread ? 'font-medium text-d900' : 'text-d700'}">${o.you ? '<span class="font-normal text-d700">คุณ: </span>' : ''}${esc(o.preview)}</span>
          ${rowChips(o)}
          ${o.stage ? `<span class="badge mt-1 inline-flex w-fit shrink-0 bg-danger15 text-danger-ink">${IC('alert-triangle', 13)}<span class="truncate">${o.stage}</span></span>` : ''}
          ${o.urgent ? `<span class="mt-1 flex min-w-0 items-center gap-1 rounded bg-danger10 px-1.5 py-0.5 text-2xs text-danger-ink">${IC('clock-exclamation', 12)}<span class="shrink-0 font-semibold">${o.urgent.when}</span><span class="shrink-0">·</span><span class="min-w-0 truncate">${o.urgent.title}</span><span class="shrink-0 font-semibold">+${o.urgent.more}</span></span>` : ''}
        </span>
      </div>
      <span class="flex shrink-0 flex-col items-end justify-between self-stretch py-0.5">
        <span class="flex flex-col items-end gap-1.25">
          <span class="flex items-center gap-1 text-2xs text-d700 ${unread ? 'font-semibold' : ''}">${o.metaAi ? `<span role="img" aria-label="Meta AI กำลังควบคุมห้องนี้" title="Meta AI กำลังควบคุมห้องนี้" class="flex">${IC('sparkles', 12, 'text-d700')}</span>` : ''}${o.time}</span>
          ${unread ? `<span class="flex h-4.5 min-w-4.5 items-center justify-center rounded-full bg-danger px-1 text-2xs font-semibold text-white">${o.unread}</span>` : ''}
          ${o.draft ? `<span class="badge gap-0.5 bg-warning15 text-warning-ink" title="มี ${o.draft} ร่างคำสั่งซื้อรอจัดการ">${IC('file-alert', 11)}${o.draft}</span>` : ''}
        </span>
        ${o.folder ? `<span class="badge max-w-28 bg-d100 text-d600">${IC('folder', 11)}<span class="truncate">${o.folder}</span></span>` : ''}
      </span>
    </div>
  </div>`
}
const listCard = (rows, cls = '') =>
  `<div class="card overflow-hidden ${cls}"><div class="rows">${rows.map(inboxRow).join('')}</div></div>`

function inboxListHeader() {
  return `<div class="flex items-center gap-3 border-b border-d200 px-4 pt-3 text-sm">

  return `<div class="grid gap-4 ${dev.k === 'm' ? '' : 'grid-cols-2'}">${old}${neu}</div>`
