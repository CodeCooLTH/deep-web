/* 🛑 ไอคอนต้องเป็น solar *-bold-duotone ไม่ใช่ tabler เส้นบาง
   — นี่คือลายเซ็นภาพของแอปจริง (ดู dashboard: ไทล์ "สถานะคำสั่งซื้อ" ใช้ iconify--solar
   size-[30px] ระบายด้วย text-warning/text-primary) ไอคอนเส้นบางบนไทล์เทาคือสาเหตุที่
   ม็อกอัพ 2 รอบแรกดูจืดเมื่อวางข้าง dashboard จริง */
function ic(name, cls){
  const key = String(name).replace(/^(tabler|solar):/,'')
  const body = SOLAR[key] || SOLAR['question-circle-bold-duotone']
  return `<svg viewBox="0 0 24 24" aria-hidden="true" style="width:1em;height:1em;display:inline-block;vertical-align:-.125em" class="${cls||''}">${body}</svg>`
}
const baht = v => '฿' + v.toLocaleString('th-TH')
const MIN_BASE = 3
/* อัตราโผล่เฉพาะตอนฐานพอ — null ไม่ใช่ 0 (กติกาเดียวกับโค้ดจริง MIN_SHIPPED_FOR_RATE) */
const rate = c => c.ship >= MIN_BASE ? Math.round(c.ret / c.ship * 100) + '%' : null

/* แถบสัดส่วน — คลาส Paces ล้วน · เทาเข้ม default-400 สำหรับ "ยังไม่จบ"
   (default-200 ต่างจากราง default-100 แค่ 1.04:1 = มองไม่เห็น — บทเรียนจาก critique) */
function bar(c, big){
  const t = c.recv + c.ret + c.pend
  const h = big ? 'h-2.5' : 'h-1.25'
  if(!t) return `<p class="text-default-400 text-2xs mb-0">ยังไม่เคยเปิดพัสดุ</p>`
  const seg = (w,cls)=> w>0 ? `<span class="${cls} block h-full" style="width:${w/t*100}%"></span>`:''
  return `<div class="bg-default-100 my-1.5 flex w-full overflow-hidden rounded-full ${h}"
      role="img" aria-label="เปิดพัสดุ ${c.ship} ใบ · รับของแล้ว ${c.recv} · ตีกลับ ${c.ret} · ยังไม่จบ ${c.pend}">
      ${seg(c.recv,'bg-success')}${seg(c.ret,'bg-warning')}${seg(c.pend,'bg-default-400')}</div>`
}
function legend(c){
  const r = rate(c)
  return `<div class="text-2xs flex flex-wrap items-center gap-x-2.5" aria-hidden="true">
    <span class="text-default-600 inline-flex items-center gap-1"><span class="bg-success size-1.5 shrink-0 rounded-full"></span>รับของ <b class="text-default-900 font-semibold tabular-nums">${c.recv}</b></span>
    ${c.ret?`<span class="text-default-600 inline-flex items-center gap-1"><span class="bg-warning size-1.5 shrink-0 rounded-full"></span>ตีกลับ <b class="text-warning-ink font-semibold tabular-nums">${c.ret}</b></span>`:''}
    ${c.pend?`<span class="text-default-600 inline-flex items-center gap-1"><span class="bg-default-400 size-1.5 shrink-0 rounded-full"></span>ยังไม่จบ <b class="text-default-900 font-semibold tabular-nums">${c.pend}</b></span>`:''}
    <span class="text-default-400">${r?`อัตราตีกลับ <b class="${c.ret?'text-warning-ink':''} font-semibold">${r}</b>`:'ยังบอกอัตราไม่ได้ (ต้องมีพัสดุครบ 3 ใบ)'}</span>
  </div>`
}
const avatar = (c,sz='size-8') => `<div class="bg-primary/10 text-primary flex ${sz} shrink-0 items-center justify-center rounded-full text-sm font-semibold">${c.i}</div>`
</script>

/* ═══════════════════════════════════════════════════════════════════════════

     · แถวไอคอนไทล์     Base: ไฟล์เดียวกัน (btn btn-icon bg-light size-8 + ป้าย + ค่าตัวหนา)
     · การ์ดคน 3 สถิติ  Base: apps/users/contacts/page.tsx (ContactCard)

    ${statCard({icon:'wallet-money-bold-duotone',tone:'text-success',title:'ยอดซื้อสะสมทั้งร้าน',value:baht(C.reduce((a,c)=>a+c.spent,0)),bullet:'bg-success',sub:'เฉลี่ยต่อคน',total:baht(Math.round(C.reduce((a,c)=>a+c.spent,0)/C.length))})}
  </div>

  <div class="card">
    <div class="card-header">
      <h5 class="card-title mb-0">ลูกค้าเสี่ยงสูง + ต้องเฝ้าระวัง <span class="text-default-400 tabular-nums">19</span></h5>
      <span class="text-default-400 text-xs">เรียงตามอัตราตีกลับมากไปน้อย</span>
    </div>
    <div class="table-wrapper"><div class="table-responsive"><table class="table">
      <thead class="bg-light/50"><tr>
        ${th('ลูกค้า','ps-5')}${th('ความน่าเชื่อถือ (ทั้งระบบ)')}${th('สถานะ','text-center')}${th('อัตราตีกลับ','text-end')}${th('ออเดอร์','text-end')}${th('ยอดซื้อสะสม','text-end')}${th('ซื้อล่าสุด','text-end pe-3')}
      </tr></thead>
      <tbody>${[...C].sort((a,b)=>(b.ret/Math.max(b.ship,1))-(a.ret/Math.max(a.ship,1))).map(deskRow).join('')}</tbody>
    </table></div></div>
  </div>`
}

function VariantCMobile(){
  /* C — เปิดมาเจอ "งานที่ต้องทำ" ก่อน : ไทล์ใหญ่เต็มความกว้าง แล้วค่อยเป็นรายการ */
  const watch = C.filter(c=>c.risk==='high'||c.risk==='watch')
  const rest  = C.filter(c=>c.risk!=='high'&&c.risk!=='watch')
  const big = (icon,tone,label,sub,count)=>`
    <a class="border-default-200 flex items-center gap-3 border-b border-dashed px-4 py-3 last:border-0 active:scale-95 transition-transform">
      <span class="relative inline-flex items-center justify-center px-1 py-0.5">
        <span class="${tone} text-3xl">${ic(icon)}</span>
        ${count>0?`<span class="${BADGE_CLS}">${count}</span>`:''}
      </span>
      <div class="min-w-0 flex-1">
        <p class="text-default-900 mb-0 text-sm font-bold">${label}</p>
        <p class="text-default-500 mb-0 text-xs">${sub}</p>
      </div>
      <span class="text-default-400 size-5">${ic('alt-arrow-right-linear')}</span>
    </a>`
  return `
  <div class="-mx-4 -mt-4 space-y-2.5">
    ${customerHero()}
    <div class="card">
      <div class="card-header !py-3"><h4 class="card-title mb-0 flex items-center gap-1.5">
        <span class="size-4 text-primary">${ic('danger-triangle-bold-duotone')}</span>ต้องจัดการก่อน</h4></div>
      ${big('danger-triangle-bold-duotone','text-danger','ลูกค้าเสี่ยงสูง','ตีกลับ ≥2 ครั้ง และอัตรา ≥30%',2)}
      ${big('eye-bold-duotone','text-warning','ต้องเฝ้าระวัง','มีสัญญาณอย่างน้อย 1 อย่าง',17)}
      ${big('box-bold-duotone','text-info','เคยตีกลับกับร้านนี้','ควรเก็บเงินปลายทางอย่างระมัดระวัง',12)}
    </div>
    <div class="card">
      ${chatToolbar('warn')}
      <div class="mt-2">${watch.map(chatRow).join('')}</div>
    </div>
    <div class="card">
      <div class="card-header !py-3"><h4 class="card-title mb-0">ลูกค้าอื่น <span class="text-default-400 tabular-nums">${rest.length}</span></h4></div>
      ${rest.map(chatRow).join('')}
    </div>
  </div>`
}

function VariantC(){
  /* 🛑 สองชุดอยู่ใน DOM พร้อมกัน ให้ CSS ตัดสิน — แบบเดียวกับ dashboard/page.tsx:518,568
     จุดตัด `md` (768) เพราะ user เคาะว่า **แท็บเล็ตเป็นแบบเดียวกับเดสก์ท็อป** */
  return `<div class="md:hidden">${VariantCMobile()}</div><div class="hidden md:block">${VariantCDesktop()}</div>`
}

const VARIANTS = {
  A:{name:'หน้าแรกของลูกค้า (hero + ไทล์ + รายการแชท)', fn:VariantA},
  B:{name:'ยอดซื้อสะสมเป็นพระเอก', fn:VariantB},
  C:{name:'งานที่ต้องทำก่อน (มือถือ ≠ จอใหญ่)', fn:VariantC},
}
</script>
<script>
/* ───────────────────────────────────────────────────────────────────────────
   โหมด frame — เรนเดอร์เฉพาะตัว variant (ไฟล์นี้ถูก iframe เรียกตัวเอง)
   ใช้ iframe จริงเพราะ breakpoint ของ Tailwind ผูกกับ **viewport ไม่ใช่ container**
   ⇒ ถ้าย่อด้วย div กว้าง 390px บนจอ 1440 จะยัง apply `lg:` = เห็นเดสก์ท็อปทั้งที่ตั้งใจดูมือถือ
   (บทเรียนเดียวกับ `unlayered-css-beats-utilities.md`)
   ─────────────────────────────────────────────────────────────────────────── */
const qs = new URLSearchParams(location.search)
const frame = qs.get('frame')

if (frame) {
  document.documentElement.setAttribute('data-bs-theme','light')
  document.body.className = 'bg-body-bg'
  /* 🛑 ซ่อน scrollbar ในกรอบ — iframe กว้าง 768 แต่ scrollbar กิน ~15px ⇒ clientWidth 753
     ⇒ `md:` (768) ไม่ทำงาน กรอบแท็บเล็ตเลยโชว์ layout มือถือทั้งที่ควรเป็นของจอใหญ่
     แท็บเล็ตจริงใช้ overlay scrollbar ที่ไม่กินความกว้าง การซ่อนตรงนี้จึง *ตรงกับของจริงกว่า* */
  const sb = document.createElement('style')
  sb.textContent = 'html{scrollbar-width:none}html::-webkit-scrollbar{width:0;height:0}'
  document.head.appendChild(sb)
  document.body.innerHTML = `<div class="p-4">${(VARIANTS[frame]||VARIANTS.A).fn()}</div>`
} else {
  const cur = (qs.get('variant') || 'A').toUpperCase()
  const keys = Object.keys(VARIANTS)
  const v = VARIANTS[cur] ? cur : 'A'
  const go = k => { const u = new URL(location.href); u.searchParams.set('variant', k); location.replace(u) }
  const step = d => go(keys[(keys.indexOf(v) + d + keys.length) % keys.length])

  const file = location.pathname
  const dev = (w,h,label,sub,scale) => `
    <figure class="proto-dev" style="margin:0">
      <figcaption>${label} <span style="font-weight:400;color:#6b7280">${sub}</span></figcaption>
      ${scale
        ? `<div class="proto-scalebox"><div class="proto-scale"><iframe src="${file}?frame=${v}" width="${w}" height="${h}" title="${label}"></iframe></div></div>`
        : `<iframe src="${file}?frame=${v}" width="${w}" height="${h}" title="${label}"></iframe>`}
    </figure>`

  document.body.className = 'proto-shell'
  document.body.innerHTML = `
    <div class="proto-head">
      <h1>00057 — re-design หน้าลูกค้า · ทางเลือก ${v}: ${VARIANTS[v].name}</h1>
      <p>3 ทางเลือกที่ <b>ต่างกันเชิงโครงสร้าง</b> ไม่ใช่ต่างกันแค่สี — สลับด้วยแถบดำล่างจอ หรือปุ่มลูกศร ← → บนคีย์บอร์ด</p>
      <div class="proto-q"><b>คำถามที่ต้องตอบ:</b> หน้ารายชื่อลูกค้าควรจัดข้อมูลแบบไหน ในเมื่อต้อง
        <b>เน้นสถิติความน่าเชื่อถือ</b> และ <b>ยอดซื้อสะสมรายคนก็ยังจำเป็น</b> พร้อมกัน<br>
        <span style="color:#6b7280">CSS ทั้งหมดดึงสดจาก prod (<code>seller.deepthailand.app</code>) — สีและ primitive ที่เห็นคือของจริงวันนี้ ไม่ใช่ token ที่เขียนเลียน</span></div>
    </div>
    <div class="proto-rail">
      ${dev(390,760,'มือถือ','390 × 760')}
      ${dev(820,760,'แท็บเล็ต','820 × 760 · iPad แนวตั้งจริงคือ 810–834 ไม่ใช่ 768')}
    </div>
    <div class="proto-rail" style="padding-top:0">
      ${dev(1280,900,'เดสก์ท็อป','1280 × 900 · ย่อ 78% ให้เห็นทั้งความกว้างโดยไม่ต้องเลื่อน',true)}
    </div>
    <div class="proto-bar" role="group" aria-label="สลับทางเลือก">
      <button type="button" aria-label="ทางเลือกก่อนหน้า" data-step="-1">&#8592;</button>
      <span class="lbl">${v} — ${VARIANTS[v].name}<small>${keys.join(' · ')}</small></span>
      <button type="button" aria-label="ทางเลือกถัดไป" data-step="1">&#8594;</button>
    </div>`

  document.querySelectorAll('.proto-bar button').forEach(b =>
    b.addEventListener('click', () => step(Number(b.dataset.step))))
  addEventListener('keydown', e => {
    const t = e.target
    // ไม่ยึดลูกศรตอนโฟกัสอยู่ในช่องกรอก
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return
    if (e.key === 'ArrowLeft') step(-1)
    if (e.key === 'ArrowRight') step(1)
  })
}
</script>
</body>
</html>
