<script>
const IC = (n, s = 12, c = '') => `<iconify-icon icon="${n.includes(':') ? n : 'tabler:' + n}" width="${s}" height="${s}" class="${c}" noobserver aria-hidden="true"></iconify-icon>`
const DEVS = [
  { k: 'd', w: 1440, label: 'Desktop 1440' },
  { k: 't', w: 768, label: 'Tablet 768' },
]
const STATES = [
  ['OK', 'OK — มีข้อมูลครบ'],
  ['NOT_CONNECTED', 'ยังไม่เชื่อมบัญชีโฆษณา'],
  ['COST_MISSING', 'ต้นทุนสินค้าไม่ครบ'],
  ['LOADING', 'กำลังโหลด (Meta ยังไม่ตอบ)'],
]
const S = { st: 'OK', s2: null, f: {}, bub: { d: false, t: false }, trend: { d: 'sales', t: 'sales' }, grp: { d: 'รายวัน', t: 'รายวัน' }, open: { d: 0, t: 0, m: 0 }, sort: { d: 'orders', t: 'orders', m: 'orders' }, exp: { d: 'admd', t: null, m: 'admd' } }
const meta = () => S.st !== 'NOT_CONNECTED'
const loading = () => S.st === 'LOADING'
const baht = (n) => '฿' + Math.round(n).toLocaleString('en-US')
const baht2 = (n) => '฿' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
const num = (n) => Math.round(n).toLocaleString('en-US')
const pct = (n, d = 1) => n.toFixed(d) + '%'
const C = { primary: '#236dc9', zeta: '#db9052' }
const cssv = (n) => getComputedStyle(document.documentElement).getPropertyValue('--' + n).trim()
const btnH = (dev) => (dev.k === 'd' ? '' : 'min-h-11')
const NA = '<span class="text-d500">—</span><span class="sr-only">ไม่มีข้อมูล</span>'

function photo(h) {
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' fill='hsl(${h},35%,42%)'/><circle cx='20' cy='20' r='11' fill='none' stroke='hsl(${h},30%,85%)' stroke-width='4'/><circle cx='20' cy='20' r='3' fill='hsl(${h},30%,85%)'/></svg>`
  return 'data:image/svg+xml,' + encodeURIComponent(svg)
}

// ── ข้อมูลตัวอย่าง (สอดคล้องกันทุกส่วน: ผลรวมโฆษณา = แคมเปญ = ตัวเลขหลัก) ──
const ADS = [
  { id: 'v360a', c: 'v360', set: 'กลุ่มรถซิ่ง 25–44', name: 'video 360 ล้อแม็ก A', h: 205, spend: 4900, sales: 37000, orders: 90, chats: 330, mchats: 480, impr: 400000, clicks: 8400, cogs: 20300 },
  { id: 'v360b', c: 'v360', set: 'กลุ่มรถซิ่ง 25–44', name: 'video 360 ล้อแม็ก B', h: 190, spend: 2300, sales: 15400, orders: 38, chats: 140, mchats: 222, impr: 240000, clicks: 3700, cogs: 8500 },
  { id: 'wheel1', c: 'wheel', set: 'ทั่วไทย ชาย 20–50', name: 'ล้อแม็ก carousel 8 แบบ', h: 30, spend: 4600, sales: 28000, orders: 86, chats: 250, mchats: 330, impr: 380000, clicks: 7400, cogs: 16200 },
  { id: 'admda', c: 'admd', set: 'Lookalike 1%', name: 'ADMD โช้คหน้า รีวิวลูกค้า', h: 350, spend: 3100, sales: 3500, orders: 9, chats: 80, mchats: 160, impr: 300000, clicks: 7800, cogs: 2000 },
  { id: 'admdb', c: 'admd', set: 'Lookalike 1%', name: 'ADMD โช้คหลัง ภาพเดี่ยว', h: 330, spend: 1700, sales: 3100, orders: 8, chats: 45, mchats: 90, impr: 150000, clicks: 700, cogs: 1800 },
  { id: 'admdc', c: 'admd', set: 'สนใจรถแต่ง', name: 'ADMD ชุดโช้ค + สปริง', h: 310, spend: 900, sales: 1300, orders: 3, chats: 25, mchats: 50, impr: 70000, clicks: 300, cogs: 700 },
  { id: 'p1111', c: 'promo', set: 'ทั่วไทย', name: 'โปร 11.11 ลด 15%', h: 45, spend: 900, sales: 3800, orders: 9, chats: 32, mchats: 48, impr: 80000, clicks: 860, cogs: 2100 },
  { id: 'old', c: null, set: null, name: 'โฆษณาเก่า 120208… (ถูกลบใน Meta)', h: 0, spend: null, sales: 4100, orders: 6, chats: 0, mchats: null, impr: null, clicks: null, cogs: 2300 },
]
const CAMPS = [
  { id: 'v360', name: 'video 360_Group_1', obj: 'ข้อความ', grp: 'close', status: 'เปิด', prevSpend: 6920 },
  { id: 'wheel', name: 'ล้อแม็ก_ข้อความ', obj: 'ข้อความ', grp: 'close', status: 'เปิด', prevSpend: 5000 },
  { id: 'admd', name: 'ADMD_Group_1', obj: 'ข้อความ', grp: 'close', status: 'เปิด', prevSpend: 4040 },
  { id: 'promo', name: 'โปร 11.11_การรับรู้', obj: 'การรับรู้', grp: 'other', status: 'ปิดแล้ว', prevSpend: 920 },
]
const sum = (rows, k) => rows.reduce((s, r) => s + (r[k] ?? 0), 0)
const roll = (rows) => ({ spend: sum(rows, 'spend'), sales: sum(rows, 'sales'), orders: sum(rows, 'orders'), chats: sum(rows, 'chats'), mchats: sum(rows, 'mchats'), impr: sum(rows, 'impr'), clicks: sum(rows, 'clicks'), cogs: sum(rows, 'cogs') })
CAMPS.forEach((c) => Object.assign(c, roll(ADS.filter((a) => a.c === c.id))))
const COVERED = ADS.filter((a) => a.spend > 0)
const T = roll(ADS), CV = roll(COVERED)
const KPI = {
  spend: T.spend, sales: T.sales, orders: T.orders, chats: T.chats,
  roas: CV.sales / CV.spend, cpa: CV.spend / CV.orders, close: (T.orders / T.chats) * 100,
}
const PREV = { spend: 16880, sales: 77580, orders: 222, roas: 4.42, cpa: 78.1, close: 25.8, impr: 1410000, clicks: 33840, mchats: 1250, chats: 860, reach: 380000, aov: 349 }
const SEC = { impr: T.impr, reach: 412000, freq: T.impr / 412000, ctr: (T.clicks / T.impr) * 100, cpc: T.spend / T.clicks, cpm: (T.spend / T.impr) * 1000, mchats: T.mchats, cpchat: T.spend / T.mchats, aov: T.sales / T.orders }
const PSEC = { impr: PREV.impr, reach: PREV.reach, freq: PREV.impr / PREV.reach, ctr: (PREV.clicks / PREV.impr) * 100, cpc: PREV.spend / PREV.clicks, cpm: (PREV.spend / PREV.impr) * 1000, mchats: PREV.mchats, cpchat: PREV.spend / PREV.mchats, aov: PREV.aov }

// BR-AIR-04/08 — ป้ายจัดกลุ่ม คำนวณจริงจากกฎ (ไม่ได้ใส่มือ)
const MIN_SPEND = 500, MIN_CHATS = 20
const thin = (r) => !(r.spend >= MIN_SPEND && r.chats >= MIN_CHATS)
function classify(rows) {
  const elig = rows.filter((r) => r.grp === 'close' && !thin(r))
  const base = elig.length >= 2 ? roll(elig) : null
  const roasM = base && base.sales / base.spend, cpaM = base && base.spend / base.orders
  rows.forEach((r) => {
    if (r.grp !== 'close') return (r.tag = null, r.why = 'วัตถุประสงค์การรับรู้ ไม่จัดกลุ่ม')
    if (thin(r)) return (r.tag = 'thin', r.why = 'ใช้เงินไม่ถึง ฿500 หรือแชทเข้าร้านไม่ถึง 20 ราย ยังตัดสินไม่ได้')
    if (!base) return (r.tag = null, r.why = 'มีแคมเปญให้เทียบไม่พอ')
    const ro = r.sales / r.spend, cp = r.orders ? r.spend / r.orders : Infinity
    if (ro >= 1.2 * roasM && cp <= 0.85 * cpaM) return (r.tag = 'good', r.why = `ROAS ${ro.toFixed(1)} สูงกว่าแคมเปญข้อความเฉลี่ย ${roasM.toFixed(1)}`)
    if ((r.orders === 0 && r.spend >= 3 * cpaM) || ro <= 0.6 * roasM || cp >= 1.5 * cpaM) return (r.tag = 'watch', r.why = `ROAS ${ro.toFixed(1)} ต่ำกว่าแคมเปญข้อความเฉลี่ย ${roasM.toFixed(1)}`)
    r.tag = 'ok'; r.why = `ใกล้ค่าเฉลี่ยแคมเปญข้อความ (ROAS ${roasM.toFixed(1)})`
  })
}
CAMPS.forEach((c) => (c.grp = c.grp))
ADS.forEach((a) => (a.grp = a.c ? CAMPS.find((c) => c.id === a.c).grp : 'other'))
classify(CAMPS); classify(ADS.filter((a) => a.c))
const TAG = {
  good: ['ทำได้ดี', 'bg-primary15 text-primary-ink', 'trending-up'],
  watch: ['ควรดู', 'bg-warning15 text-warning-ink', 'alert-triangle'],
  ok: ['ปกติ', 'bg-light text-d800', ''],
  thin: ['ข้อมูลน้อย', 'border border-d300 text-d700', 'info-circle'],
}
const tagBadge = (r) => (r.tag ? `<span class="badge ${TAG[r.tag][1]}" title="${r.why}">${TAG[r.tag][2] ? IC(TAG[r.tag][2], 12) : ''}${TAG[r.tag][0]}</span>` : '')

// ── ทิศทาง (BR-AIR-02) + DeltaText 3 tone ──
// ทิศทาง: 'good' | 'bad' | 'neutral' | null — ตัวเดียวกันใช้ตัดสินสีป้ายและสีกราฟเล็ก
function trendOf(cur, prev, tone = 'signed', unit = '%') {
  if (cur == null || prev == null || prev <= 0) return null
  const v = unit === 'pt' ? cur - prev : ((cur - prev) / prev) * 100
  if (tone === 'neutral') return 'neutral'
  const up = v >= 0
  return (tone === 'signed' ? up : !up) ? 'good' : 'bad'
}
// การ์ด KPI ตามธีม StatisticCard: ลูกศร + % เป็นข้อความสี (ไม่ใช่ badge)
function deltaText(cur, prev, tone = 'signed', unit = '%') {
  const tr = trendOf(cur, prev, tone, unit)
  if (!tr) return '<span class="text-d500">—</span>'
  const v = ((cur - prev) / prev) * 100, up = v >= 0
  const ink = tr === 'good' ? 'text-success-ink' : tr === 'bad' ? 'text-warning-ink' : 'text-d700'
  return `<span class="flex items-center gap-1 tabular-nums ${ink}">${IC(up ? 'arrow-up' : 'arrow-down', 14)}${Math.abs(v).toFixed(2)}%${tr === 'neutral' ? '' : `<span class="sr-only">${tr === 'good' ? 'ดีขึ้น' : 'แย่ลง'}</span>`}</span>`
}
// % เปลี่ยน = badge ทุกจุด (ท่า Paces dashboard/analytics TotalOrder.tsx: `badge text-sm py-0 bg-*/15` + ลูกศร + ค่าสัมบูรณ์)
// ดีขึ้น success · แย่ลง warning (ไม่ใช้ danger — BR-AIR-03) · กลาง light + เครื่องหมาย +/− (ไม่มีลูกศร)
function delta(cur, prev, tone = 'signed', unit = '%', big = false) {
  const tr = trendOf(cur, prev, tone, unit)
  if (!tr) return `<span class="text-xs text-d500">—</span>`
  // % ทุกจุด (มติ user 2026-11-15 "ทำไมเดี๋ยวใช้จุด เดี๋ยวใช้ %") — ตัวชี้วัดที่เป็นอัตรา (unit 'pt') บอกค่าช่วงก่อนใน tooltip
  const v = ((cur - prev) / prev) * 100
  const up = v >= 0
  const num = Math.abs(v).toFixed(1) + '%'
  const tip = unit === 'pt' ? ` title="ช่วงก่อน ${prev.toFixed(prev < 10 ? 2 : 1)}%"` : ''
  const cls = tr === 'good' ? 'bg-success15 text-success-ink' : tr === 'bad' ? 'bg-warning15 text-warning-ink' : 'bg-light text-d700'
  const body = tr === 'neutral' ? (up ? '+' : '−') + num : IC(up ? 'arrow-up' : 'arrow-down', 12) + num + `<span class="sr-only">${tr === 'good' ? 'ดีขึ้น' : 'แย่ลง'}</span>`
  return `<span class="badge tabular-nums ${big ? 'text-sm' : ''} ${cls}"${tip}>${body}</span>`
}

const DAYS = 30
function series(total, seed, trend = 0, noise = 0.25) {
  const raw = Array.from({ length: DAYS }, (_, i) => Math.max(0.15, 1 + trend * (i / DAYS - 0.5) + noise * Math.sin(i * 1.7 + seed) + 0.12 * Math.cos(i * 0.6 + seed * 2)))
  const s = raw.reduce((a, b) => a + b, 0)
  return raw.map((v) => (v / s) * total)
}

function cardFunnel(dev) {

  const steps = [
    { l: 'การแสดงผล', v: M ? T.impr : null, p: PREV.impr, s: 'Meta' },

    { l: 'คำสั่งซื้อ', v: T.orders, p: PREV.orders, s: null },
  ]
  const rates = steps.slice(1).map((s, i) => {
    const a = steps[i]
    const cur = a.v && s.v != null ? (s.v / a.v) * 100 : null
    const prev = (s.p / a.p) * 100
    return { cur, prev, drop: cur == null ? null : (cur - prev) / prev }

  const worst = rates.reduce((w, r, i) => (r.drop != null && r.drop < -0.15 && (w < 0 || r.drop < rates[w].drop) ? i : w), -1)
  // หน้าตาตาม ref ของ user (Highcharts funnel demo) ทำด้วย ECharts ที่มีในโปรเจกต์ (src/components/wrappers/EChart.tsx · Apache 2.0)

      colors: [C.primary, C.zeta, cssv('d400')], stroke: { width: 0 }, dataLabels: { enabled: false },
      legend: { show: true, position: 'bottom', fontSize: '12px', markers: { size: 6 } },
      plotOptions: { pie: { donut: { size: '78%', labels: { show: true, name: { offsetY: -4, fontSize: '13px' }, value: { fontSize: '22px', fontWeight: 600, color: cssv('d900'), formatter: (v) => num(+v) }, total: { show: true, label: 'เข้าถึง ≈', color: cssv('d600'), formatter: (w) => num(w.globals.seriesTotals.reduce((a, b) => a + b, 0)) } } } } },
      tooltip: { ...tt(), y: { formatter: (v) => '≈ ' + num(v) + ' คน' } },
    })
    // funnel (ECharts series 'funnel' — ทรงตาม Highcharts demo: ชั้นบนกรวย · ชั้นล่างเป็นคอกว้างเท่ากัน)
    const fel = document.getElementById(`fn-${k}`)
    if (fel && FUNNEL[k] && window.echarts) {
      const { steps: st, rates: rt, worst: wo } = FUNNEL[k]
      const ink = cssv('d900'), sub = cssv('d600')
      const pctTxt = (r) => (r.cur == null ? '—' : pct(r.cur, r.cur < 10 ? 2 : 1))
      const chg = (r) => { const v = ((r.cur - r.prev) / r.prev) * 100; return (v >= 0 ? '↑ ' : '↓ ') + Math.abs(v).toFixed(1) + '%' }
      const ec = echarts.init(fel, null, { renderer: 'svg' }); ECH.push(ec)
      ec.setOption({
        textStyle: { fontFamily: 'Anuphan, sans-serif' },
        tooltip: { trigger: 'item', backgroundColor: cssv('card'), borderColor: cssv('d300'), textStyle: { color: ink }, formatter: (pr) => { const x = st[pr.dataIndex]; return `<b>${x.l}</b><br>${x.v == null ? '—' : num(x.v)}${pr.dataIndex ? `<br>ผ่านจากขั้นก่อน ${pctTxt(rt[pr.dataIndex - 1])}` : ''}` } },
        series: [{
          type: 'funnel', sort: 'none', left: '4%', width: '58%', top: 8, bottom: 8, gap: 2, min: 40, max: 100, minSize: '38%', maxSize: '100%',
          data: st.map((x, i) => ({ name: x.l, value: [100, 40, 40, 40, 40][i], itemStyle: { color: x.s === 'Meta' ? cssv('info') : C.primary, borderColor: cssv('card'), borderWidth: 1 } })),
          emphasis: { itemStyle: { opacity: 0.85 } },
          labelLine: { length: 28, lineStyle: { width: 1, color: cssv('d400') } },
          label: {
            show: true, position: 'right', lineHeight: 18,
            formatter: (pr) => {
              const i = pr.dataIndex, x = st[i]
              const head = `{n|${x.l}} {v|(${x.v == null ? '—' : num(x.v)})}`
              if (!i) return head
              const r = rt[i - 1]; if (r.cur == null) return head
              const good = r.cur >= r.prev
              return `${head}\n{s|ผ่าน ${pctTxt(r)}} {${good ? 'g' : 'b'}|${chg(r)}}${i === 3 ? ' {i|ต่างแหล่ง}' : ''}`
            },
            rich: {
              n: { fontSize: 14, fontWeight: 600, color: ink }, v: { fontSize: 14, fontWeight: 600, color: ink },
              s: { fontSize: 12, color: sub },
              g: { fontSize: 11, fontWeight: 600, color: cssv('success-ink'), backgroundColor: cssv('success15'), padding: [2, 6], borderRadius: 4 },
              b: { fontSize: 11, fontWeight: 600, color: cssv('warning-ink'), backgroundColor: cssv('warning15'), padding: [2, 6], borderRadius: 4 },
              i: { fontSize: 11, fontWeight: 600, color: cssv('info-ink'), backgroundColor: cssv('info15'), padding: [2, 6], borderRadius: 4 },
            },
          },
        }],
      })
    }
    // bubble
    const bel = document.getElementById(`bub-${k}`)
    if (bel) {
      const pts = ADS.filter((a) => a.c && !thin(a))
      const toPt = (a) => ({ x: a.spend, y: a.orders, z: a.chats, name: a.name })
      mk(bel, {
        chart: base(k === 'm' ? 240 : 260, { type: 'bubble' }),
        series: [{ name: 'ต้นทุนต่อออเดอร์ต่ำกว่าเฉลี่ย', data: pts.filter((a) => cpaOf(a) <= KPI.cpa).map(toPt) }, { name: 'สูงกว่าเฉลี่ย', data: pts.filter((a) => cpaOf(a) > KPI.cpa).map(toPt) }],
        colors: [C.primary, C.zeta], fill: { opacity: 0.7 }, dataLabels: { enabled: false }, legend: { show: true, position: 'bottom', fontSize: '12px', markers: { size: 6 } }, grid,
        plotOptions: { bubble: { minBubbleRadius: 5, maxBubbleRadius: 22 } },
        xaxis: { type: 'numeric', min: 0, max: 5500, tickAmount: 5, labels: { formatter: (v) => '฿' + (v / 1000).toFixed(1) + 'k', style: { fontSize: '11px' } }, title: { text: 'ค่าโฆษณา', style: { fontSize: '11px', fontWeight: 400 } } },
        yaxis: { min: 0, max: 100, tickAmount: 4, labels: { formatter: (v) => Math.round(v), style: { fontSize: '11px' } }, title: { text: 'ออเดอร์', style: { fontSize: '11px', fontWeight: 400 } } },
        tooltip: { ...tt(), custom: ({ seriesIndex, dataPointIndex, w }) => { const p = w.config.series[seriesIndex].data[dataPointIndex]; return `<div class="px-3 py-2 text-xs"><b>${p.name}</b><br>ค่าโฆษณา ${baht(p.x)} · ${p.y} ออเดอร์ · แชท ${p.z}<br>${baht2(p.x / p.y)} ต่อออเดอร์</div>` } },
      })
    }
    // waterfall (stacked column ฐานโปร่ง)
    const wel = document.getElementById(`wf-${k}`)
    if (wel) {
      const g = CV.sales - CV.cogs, net = g - CV.spend
      const cats = ['ยอดขาย', 'ต้นทุนสินค้า', 'ค่าโฆษณา', 'กำไร']
      mk(wel, {
        chart: base(k === 'm' ? 220 : 240, { type: 'bar', stacked: true }),
        series: [{ name: 'ฐาน', data: [0, g, net, 0] }, { name: 'ค่า', data: [CV.sales, CV.cogs, CV.spend, net] }],
        colors: ['transparent', ({ dataPointIndex }) => (dataPointIndex === 1 || dataPointIndex === 2 ? cssv('d400') : C.primary)], fill: { opacity: [0, 1] },
        plotOptions: { bar: { columnWidth: '55%', borderRadius: 2, dataLabels: { position: 'top' } } },
        states: { hover: { filter: { type: 'none' } } },
        dataLabels: { enabled: true, enabledOnSeries: [1], formatter: (v, o) => (o.dataPointIndex === 1 || o.dataPointIndex === 2 ? '−' : '') + '฿' + (v / 1000).toFixed(1) + 'k', style: { fontSize: '11px', fontWeight: 600, colors: [cssv('d900')] }, offsetY: -20 },
        xaxis: { categories: cats, labels: { style: { fontSize: '11px' } }, axisBorder: { show: false }, axisTicks: { show: false } },
        yaxis: { labels: { formatter: (v) => '฿' + Math.round(v / 1000) + 'k', style: { fontSize: '11px' } }, tickAmount: 4 },
        grid, legend: { show: false }, tooltip: { ...tt(), enabledOnSeries: [1], y: { formatter: (v) => baht(v) } },
      })
    }
    // กำไรรายแคมเปญ
    const pel = document.getElementById(`pc-${k}`)
    if (pel) {
      const rows = CAMPS.map((c) => ({ n: c.name, v: c.sales - c.cogs - c.spend })).sort((a, b) => b.v - a.v)
      mk(pel, {
        chart: base(k === 'm' ? 200 : 240, { type: 'bar' }),
        series: [{ name: 'กำไรหลังค่าโฆษณา', data: rows.map((r) => r.v) }],
        colors: [({ value }) => (value < 0 ? C.zeta : C.primary)],
        plotOptions: { bar: { horizontal: true, barHeight: '55%', borderRadius: 2 } },
        dataLabels: { enabled: false }, grid, legend: { show: false },
        xaxis: { categories: rows.map((r) => r.n), labels: { formatter: (v) => (v < 0 ? '−' : '') + '฿' + Math.abs(v / 1000).toFixed(0) + 'k', style: { fontSize: '11px' } } },
        yaxis: { labels: { maxWidth: k === 'm' ? 110 : 160, style: { fontSize: '11px' } } },
        tooltip: { ...tt(), y: { formatter: (v) => (v < 0 ? '−' : '') + baht(Math.abs(v)) } },
      })
    }
  }
}

// ── วาด ──
function renderNav() {
  document.getElementById('stNav').innerHTML = STATES.map(([v, l]) => `<button type="button" role="tab" class="tabbtn btn btn-sm border border-d300 text-d800" data-st="${v}" aria-selected="${S.st === v}">${l}</button>`).join('')
  document.querySelectorAll('[data-st]').forEach((b) => b.addEventListener('click', () => { S.st = b.dataset.st; renderNav(); render() }))
}
function render() {
  const label = STATES.find(([v]) => v === S.st)[1]
  CHARTS.forEach((c) => c.destroy()); CHARTS = []
  document.getElementById('app').innerHTML = `<section>
    <h2 class="mb-1 text-lg font-bold text-d900">/reports/ads-summary — สถานะ: ${label}</h2>
    <ul class="mb-4 max-w-[1500px] list-disc ps-5 text-xs text-d700">
      <li>ตัวเลขทุกส่วนมาจากชุดข้อมูลเดียวกัน: ผลรวมโฆษณา = แถวแคมเปญ = ตัวเลขหลัก · ป้าย "ทำได้ดี/ควรดู/ข้อมูลน้อย" และคำแนะนำคำนวณจากกฎ BRD §6 / BR-AIR-08 จริงในม็อกอัพนี้</li>
      <li>แย่ลง = ส้มเตือน (ไม่ใช่แดง) ตามหน้าพี่น้อง · ค่าโฆษณาเป็นโทนกลาง · "—" = ไม่มีข้อมูล (ไม่ใช่ 0) · สีส้ม #db9052 = ตัวแทน <code>getColor('chart-zeta')</code></li>
      <li>กดได้: คู่กราฟแนวโน้ม · คำแนะนำ (กาง/หุบ) · กางแคมเปญ (ลูกศร) · เรียงครีเอทีฟ</li>
    </ul>
    <div class="space-y-10">${DEVS.map((d) => frame(d, page(d))).join('')}</div></section>`
  const on = (sel, fn) => document.querySelectorAll(sel).forEach((b) => b.addEventListener(b.tagName === 'SELECT' ? 'change' : 'click', () => fn(b)))
  on('[data-bub]', (b) => { S.bub[b.dataset.bub] = !S.bub[b.dataset.bub]; render() })
  on('[data-trend]', (b) => { const [d, x] = b.dataset.trend.split(':'); S.trend[d] = x; render() })
  on('[data-grp]', (b) => { const [d, x] = b.dataset.grp.split(':'); S.grp[d] = x; render() })
  on('[data-open]', (b) => { const [d, i] = b.dataset.open.split(':'); S.open[d] = S.open[d] === +i ? -1 : +i; render() })
  on('[data-exp]', (b) => { const [d, id] = b.dataset.exp.split(':'); S.exp[d] = S.exp[d] === id ? null : id; render() })
  on('[data-s2]', (b) => { S.s2 = S.s2 === b.dataset.s2 ? null : b.dataset.s2; render() })
  on('[data-s2opt]', (b) => { const [d, k, v] = b.dataset.s2opt.split(':'); if (k === 'sort') S.sort[d] = v; else S.f[d + k] = v; S.s2 = null; render() })
  clearTimeout(window.__dc); window.__dc = setTimeout(drawCharts, 120)
}
document.getElementById('themeBtn').addEventListener('click', () => {
  const h = document.documentElement
  h.dataset.theme = h.dataset.theme === 'dark' ? 'light' : 'dark'
  drawCharts()
})
renderNav()
render()
</script>
</body>
</html>
