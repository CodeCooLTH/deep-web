const IC = (n, s = 12, c = '') => `<iconify-icon icon="${n.includes(':') ? n : 'tabler:' + n}" width="${s}" height="${s}" class="${c}" aria-hidden="true"></iconify-icon>`
const DEVS = [{ k: 'd', w: 1280, label: 'Desktop 1280' }, { k: 't', w: 768, label: 'Tablet 768' }, { k: 'm', w: 390, label: 'Mobile 390' }]

const TONE = { primary: 'bg-primary15 text-primary-ink', danger: 'bg-danger15 text-danger-ink', success: 'bg-success15 text-success-ink', warning: 'bg-warning15 text-warning-ink', neutral: 'bg-d200 text-d800' }

// ---------- sparkline: ของจริงใช้ ApexChart wrapper (area + sparkline:true, stroke 2 smooth, gradient 0.5→0) ตาม Stat.tsx ----------
function spark(data, color, h = 44) {
  const W = 100, max = Math.max(...data), n = data.length
  const flat = max === 0
  const pts = data.map((v, i) => [(i / (n - 1)) * W, flat ? h - 2 : h - 2 - (v / max) * (h - 6)])
  const line = pts.map((p) => p.map((x) => x.toFixed(1)).join(',')).join(' ')
  const gid = uid('g')
  if (flat) return `<svg viewBox="0 0 ${W} ${h}" preserveAspectRatio="none" class="block w-full" style="height:${h}px" aria-hidden="true"><line x1="0" y1="${h - 2}" x2="${W}" y2="${h - 2}" stroke="var(--d300)" stroke-width="2" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/></svg>`
  return `<svg viewBox="0 0 ${W} ${h}" preserveAspectRatio="none" class="block w-full" style="height:${h}px" aria-hidden="true">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".5"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <polygon points="0,${h} ${line} ${W},${h}" fill="url(#${gid})"/>
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`
}
// delta ตาม Stat.tsx: ตัวเลข % + trending-up/down · ช่วงก่อนเป็น 0 = ไม่คำนวณ %
function delta(cur, prev, prevLabel) {
  if (cur === 0 && prev === 0) return ''
  if (prev === 0) return `<p class="flex flex-wrap items-center gap-x-1.5 text-xs text-d700">${badge('neutral', 'ใหม่')}<span>ช่วงก่อนยังไม่มี</span></p>`
  const pct = ((cur - prev) / prev) * 100
  const up = pct >= 0
  return `<p class="flex flex-wrap items-center gap-x-1.5 text-xs text-d700"><span class="inline-flex items-center gap-0.5 font-semibold ${up ? 'text-success-ink' : 'text-danger-ink'}">${IC(up ? 'trending-up' : 'trending-down', 14)}${Math.abs(pct).toFixed(1)}%</span><span class="whitespace-nowrap">${prevLabel}</span></p>`
}

function statCard(dev, c) {
  const m = dev.k === 'm'
  const head = `<div class="flex items-center gap-2"><span class="flex size-8 shrink-0 items-center justify-center rounded-full ${c.iconCls || 'bg-light text-d700'}">${IC(c.icon, 16)}</span>
    <h5 class="min-w-0 truncate text-xs font-semibold text-d700" title="${c.title}">${c.title}</h5></div>`
  const val = `<p class="mt-3 text-xl font-bold leading-tight tabular-nums ${c.valCls || 'text-d900'}">${c.value}</p>${c.unit ? `<p class="text-xs text-d700">${c.unit}</p>` : ''}`
  const foot = `<div class="mt-2 space-y-0.5">${c.sub || ''}</div>`
  const chart = c.chart ?? ''
  const border = c.warn ? 'outline outline-1 outline-warning' : ''
  if (m) return `<div class="card h-full ${border}"><div class="card-body flex h-full flex-col" style="padding:14px">${head}${val}${foot}<div class="mt-auto pt-2">${chart}</div></div></div>`
  return `<div class="card h-full ${border}"><div class="card-body" style="padding:${dev.k === 'd' ? '16px' : '18px'}">${head}
    <div class="grid grid-cols-2 items-end gap-3"><div class="min-w-0">${val}</div><div>${chart}</div></div>${foot}</div></div>`
}

function cards(dev, k) {
  const d = DATA[k]
  const prev = 'จาก 7 วันก่อน'
  const empty = `<p class="text-xs text-d600">ยังไม่มีข้อมูลช่วงนี้</p>`
  const zero = (a) => sum(a) === 0
  // 1 รอส่ง — ภาพ ณ ตอนนี้ ไม่มี sparkline (เหตุผลใน .md)
  const pendWarn = d.pending > 0
  const c1 = {
    title: 'รอส่ง', icon: pendWarn ? 'clock-exclamation' : 'clock', iconCls: pendWarn ? 'bg-warning15 text-warning-ink' : '',
    value: fmt(d.pending), unit: pendWarn ? `เก่าสุดรอมา ${d.oldest}` : 'ตอนนี้', warn: pendWarn,
    sub: `<p class="text-xs text-d700">ล้มเหลว <span class="tabular-nums ${d.failed ? 'font-semibold text-danger-ink' : 'text-d900'}">${d.failed}</span> <span class="text-d500">(7 วัน)</span></p>
      <p class="text-xs text-d700">ส่งล่าสุด <span class="tabular-nums text-d900">${d.last || '–'}</span></p>`,
    chart: '',
  }
  if (d.failed) c1.sub += `<a href="#" class="inline-flex ${T44(dev)} items-center text-xs font-medium text-primary-ink underline underline-offset-2">ดูที่ล้มเหลว</a>`
  const c2 = {
    title: 'ส่งสำเร็จ', icon: 'circle-check', value: fmt(sum(d.sent)), unit: 'เหตุการณ์',
    sub: zero(d.sent) ? empty : delta(sum(d.sent), d.sentPrev, prev), chart: spark(d.sent, 'var(--success)'),
  }
  const c3 = {
    title: 'ยอดขายที่ส่งให้ Meta', icon: 'receipt', value: '฿' + fmt(sum(d.sale)), unit: `${d.orders} ออเดอร์`,
    sub: (zero(d.sale) ? empty : delta(sum(d.sale), d.salePrev, prev)) + `<p class="text-2xs text-d600">นับจากตอนส่ง Purchase</p>`, chart: spark(d.sale, 'var(--primary)'),
  }
  const c4 = {
    title: 'ลีด (สนใจจริง)', icon: 'user-check', value: fmt(sum(d.lead)), unit: 'QualifiedLead',
    sub: zero(d.lead) ? empty : delta(sum(d.lead), d.leadPrev, prev), chart: spark(d.lead, 'var(--primary)'),
  }
  return [c1, c2, c3, c4].map((c) => statCard(dev, c))
}

function periodSwitch(dev) {
  const b = (t, on) => `<button type="button" aria-pressed="${on}" class="btn btn-sm ${T44(dev)} ${on ? 'bg-primary15 font-semibold text-primary-ink' : 'text-d700'}">${t}</button>`
  return `<div role="group" aria-label="ช่วงเวลา" class="inline-flex rounded border border-d300 bg-card p-0.5">${b('7 วัน', true)}${b('30 วัน', false)}</div>`
}
function statsRow(dev, k) {
  const m = dev.k === 'm'
  const log = `<a href="#" class="inline-flex ${T44(dev)} items-center gap-1 text-sm font-medium text-primary-ink">${IC('history', 16)}ดูบันทึกการส่ง ${IC('chevron-right', 14)}</a>`
  const head = m
    ? `<div class="mb-3"><div class="flex items-center justify-between gap-2"><h4 class="text-md font-semibold text-d900">ผลการส่งให้ Meta</h4>${periodSwitch(dev)}</div></div>`
    : `<div class="mb-3 flex flex-wrap items-center gap-3"><h4 class="text-md font-semibold text-d900">ผลการส่งให้ Meta</h4>${periodSwitch(dev)}<span class="ms-auto">${log}</span></div>`
  const grid = `<div class="grid gap-${m ? '3' : '5'} ${dev.k === 'd' ? 'grid-cols-4' : 'grid-cols-2'}">${cards(dev, k).join('')}</div>`
  const banner = k === 'w' ? `<div role="alert" class="mb-3 flex items-start gap-2.5 rounded-lg bg-danger15 p-3 text-sm text-danger-ink">${IC('alert-triangle', 18, 'mt-0.5')}<div><p class="font-semibold">ชุดข้อมูล เว็บไซต์ร้าน หยุดส่ง</p><p class="mt-0.5">Meta ไม่รับ token ที่ใส่ไว้ เหตุการณ์ 6 รายการรออยู่ จะส่งต่อให้เองหลังเปลี่ยน token (ไม่เกิน 7 วัน)</p></div></div>` : ''
  return `<section aria-label="ผลการส่งให้ Meta">${banner}${head}${grid}${m ? `<div class="mt-2 text-end">${log}</div>` : ''}</section>`
}

const tabs = document.querySelectorAll('.tabbtn')
function show(g) {
  tabs.forEach((b) => b.setAttribute('aria-selected', String(b.dataset.show === g)))
  document.querySelectorAll('section[data-group]').forEach((s) => { s.hidden = !(g === 'all' || s.dataset.group === g) })
}
tabs.forEach((b) => b.addEventListener('click', () => show(b.dataset.show)))

})

document.getElementById('themeBtn').addEventListener('click', () => {
