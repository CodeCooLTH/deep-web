        spacing: { 1.25: '5px', 3.75: '15px', 4.5: '18px', 7.5: '30px' },

<script>
// โครง shell / frame / section ลอกจาก 2026-11-14-00089-capi-stat-cards-mockup.html
const IC = (n, s = 12, c = '') => `<iconify-icon icon="${n.includes(':') ? n : 'tabler:' + n}" width="${s}" height="${s}" class="${c}" aria-hidden="true"></iconify-icon>`
const DEVS = [{ k: 'd', w: 1280, label: 'Desktop 1280' }, { k: 't', w: 768, label: 'Tablet 768' }, { k: 'm', w: 390, label: 'Mobile 390' }]
const T44 = (dev) => (dev.k !== 'd' ? 'min-h-11' : '')
function photo(h) {
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' fill='hsl(${h},45%,55%)'/><circle cx='20' cy='16' r='7' fill='hsl(${h},40%,88%)'/><ellipse cx='20' cy='37' rx='13' ry='10' fill='hsl(${h},40%,88%)'/></svg>`
  return 'data:image/svg+xml,' + encodeURIComponent(svg)
}
// รูปแอดจำลอง: gradient + วงไฟหน้า (แทนรูปจริง ?variant=thumb)
function adThumb(h1, h2) {
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><defs><linearGradient id='a' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='hsl(${h1},70%,45%)'/><stop offset='1' stop-color='hsl(${h2},75%,60%)'/></linearGradient></defs><rect width='24' height='24' fill='url(#a)'/><circle cx='12' cy='12' r='6' fill='rgba(255,255,255,.85)'/><circle cx='12' cy='12' r='3' fill='hsl(${h2},80%,70%)'/></svg>`
  return 'data:image/svg+xml,' + encodeURIComponent(svg)
}
function frame(dev, inner) {
  return `<div class="shrink-0"><div class="mb-2 flex items-center gap-2 text-xs font-semibold text-d700">${IC(dev.k === 'm' ? 'device-mobile' : dev.k === 't' ? 'device-tablet' : 'device-desktop', 16)}${dev.label}</div>
    <div class="frame" style="width:${dev.w}px">${inner}</div></div>`
}
function section(id, group, title, notes, body) {
  return `<section id="${id}" data-group="${group}"><h2 class="mb-1 text-lg font-bold text-d900">${title}</h2>
    <ul class="mb-4 max-w-[1500px] list-disc ps-5 text-xs text-d700">${notes.map((n) => `<li class="mt-0.5">${n}</li>`).join('')}</ul>${body}</section>`
}
const row3 = (fn) => `<div class="flex flex-wrap items-start gap-10">${DEVS.map((d) => frame(d, fn(d))).join('')}</div>`

const badge = (s) => `<span class="badge ${TONE[s]}">${STATUS_TH[s]}</span>`

    { t: '21:48:09', ev: 'ส่งถึงลูกค้า (OrderDelivered)', s: 'SKIPPED', c: { name: 'อนุชา มีสุข', h: 95 }, val: '฿480.00', ds: 'ชุดข้อมูลของเพจ', order: 'DP-000097', reason: 'เก่ากว่า 7 วัน Meta ไม่รับ' },
    { t: '16:20:55', ev: 'ซื้อ (Purchase)', s: 'SENT', c: { name: 'ธีรวัฒน์ แก้วมณี', h: 260 }, val: '฿2,340.00', ds: 'ชุดข้อมูลของเพจ', order: 'DP-000118' },
    { t: '09:03:41', ev: 'แนบสลิป (AddPaymentInfo)', s: 'SENT', c: { name: 'กมลชนก ทองดี', h: 300 }, ds: 'ชุดข้อมูลของเพจ', order: 'DP-000117', ad: { name: 'หมวกกันน็อค ลดทั้งร้าน', thumb: [0, 30], clicked: '13-11-2569 08:51', noPhoto: true } },
  ] },
]

// แผ่ข้อมูลรายวันเป็นแถวเดียว · วันที่รูปแบบ formatDateTime "dd-mm-yyyy HH:mm:ss"
const DMY = { '14 พ.ย. 2569': '14-11-2569', '13 พ.ย. 2569': '13-11-2569' }
const ROWS = DAYS.flatMap((g) => g.items.map((r) => ({ ...r, at: `${DMY[g.day]} ${r.t}` })))
const DASH = '<span class="text-d700">–</span>'

const avatar = (c, size) => `<img src="${photo(c.h)}" alt="" class="${size} shrink-0 rounded-full" />`
// รูปแอดเป็นของตกแต่ง alt="" · ไม่มีรูป = ช่องไอคอน speakerphone
const thumb = (ad) => ad.noPhoto
  ? `<span class="inline-flex size-8 shrink-0 items-center justify-center rounded bg-d100 text-primary-ink">${IC('speakerphone', 16)}</span>`
  : `<img src="${adThumb(...ad.thumb)}" alt="" class="size-8 shrink-0 rounded object-cover" />`
const orderLink = (r) => r.order ? `<a href="#" class="inline-flex min-h-11 items-center text-xs text-primary-ink hover:underline">ออเดอร์ #${r.order}</a>` : ''
const orderLinkD = (r) => r.order ? `<a href="#" class="inline-flex items-center whitespace-nowrap text-xs text-primary-ink hover:underline">ออเดอร์ #${r.order}</a>` : ''

function tableView(rows) {
  const th = ['เวลา', 'ลูกค้า', 'เหตุการณ์', 'โฆษณา', 'ชุดข้อมูล', '<span class="block w-full text-end">มูลค่า</span>', 'สถานะ', 'เหตุผล']
  const tr = (r) => `<tr>
    <td><span class="whitespace-nowrap tabular-nums text-d800">${r.at}</span></td>
    <td>${r.c ? `<span class="flex min-w-0 items-center gap-2">${avatar(r.c, 'size-8')}<span class="truncate text-d900">${r.c.name}</span></span>` : DASH}</td>
    <td><span class="flex flex-col items-start"><span class="whitespace-nowrap text-d900">${r.ev}</span>${orderLinkD(r)}</span></td>
    <td>${r.ad ? `<span class="flex min-w-0 items-center gap-2" style="max-width:14rem">${thumb(r.ad)}<span class="min-w-0">
        <span class="block truncate text-d900" title="${r.ad.name}">${r.ad.name}</span>
        <span class="block text-xs tabular-nums text-d700">คลิกเมื่อ ${r.ad.clicked}</span></span></span>` : DASH}</td>
    <td><span class="whitespace-nowrap text-d800">${r.ds}</span></td>
    <td><span class="block whitespace-nowrap text-end tabular-nums text-d900">${r.val || '–'}</span></td>
    <td>${badge(r.s)}</td>
    <td style="min-width:13rem"><span class="${r.s === 'FAILED' ? 'text-danger-ink' : 'text-d700'}">${r.reason || '–'}</span></td></tr>`
  return `<div class="table-wrapper"><table class="ptable"><thead><tr>${th.map((h) => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(tr).join('')}</tbody></table></div>`
}
// mobileCard ของ LogClient — ใช้ทั้ง Tablet 768 และ Mobile 390 (DataTable สลับเป็นตารางที่ lg = 1024px)
function cardView(dev, rows) {
  const sm = dev.k !== 'm' // sm: = ≥640px
  const card = (r) => `<div class="${sm ? 'px-5' : 'px-4'} py-3">
    <div class="flex items-start justify-between gap-3"><div class="flex min-w-0 items-center gap-2">${r.c ? avatar(r.c, 'size-9') : ''}
      <div class="min-w-0">${r.c ? `<p class="truncate text-sm font-medium text-d900">${r.c.name}</p>` : ''}
      <p class="min-w-0 ${r.c ? 'text-xs text-d800' : 'text-sm font-medium text-d900'}">${r.ev}</p></div></div>
      <span class="shrink-0">${badge(r.s)}</span></div>
    <p class="mt-0.5 text-xs text-d700"><span class="tabular-nums">${r.at}</span>${sm ? ' · ' : '<br />'}${r.ds}${r.val ? ` · <span class="tabular-nums text-d900">${r.val}</span>` : ''}</p>
    ${orderLink(r)}
    ${r.ad ? `<div class="mt-1 flex min-w-0 items-center gap-2 text-xs text-d800">${thumb(r.ad)}<span class="min-w-0 truncate" title="${r.ad.name}">จากโฆษณา ${r.ad.name} · คลิกเมื่อ ${r.ad.clicked}</span></div>` : ''}
    ${r.reason ? `<p class="mt-1 text-xs ${r.s === 'FAILED' ? 'text-danger-ink' : 'text-d800'}">${r.reason}</p>` : ''}</div>`
  return `<div class="divlist">${rows.map(card).join('')}</div>`
}
function filterBtn(dev, label, active) {
  return `<button type="button" aria-haspopup="listbox" class="btn ${dev.k === 'm' ? 'min-h-11 w-full justify-between' : dev.k === 't' ? 'min-h-11' : ''} border ${active ? 'border-primary bg-primary10 text-primary-ink' : 'border-d300 text-d800'}">${label}${IC('chevron-down', 16)}</button>`
}
function cardHeader(dev, f = {}) {
  return `<div class="card-header"><div><h4 class="card-title">บันทึกการส่ง</h4><p class="text-xs text-d700">เก็บไว้ทั้งหมด ไม่มีหมดอายุ</p></div>
    <div class="flex ${dev.k === 'm' ? 'w-full flex-col' : 'flex-row flex-wrap'} gap-2">${filterBtn(dev, f.status || 'สถานะ', !!f.status)}${filterBtn(dev, f.event || 'เหตุการณ์', !!f.event)}</div></div>`
}
function logCard(dev) {
  return `<div class="card">${cardHeader(dev)}${dev.k === 'd' ? tableView(ROWS) : cardView(dev, ROWS)}
    <div class="card-footer flex flex-wrap items-center justify-between gap-2"><span class="text-xs tabular-nums text-d700">แสดง 20 รายการ</span>
      <button type="button" class="btn border border-d300 text-d800 ${dev.k === 'm' ? 'min-h-11 w-full' : T44(dev)}">${IC('chevron-down', 16)}โหลดเพิ่ม</button></div></div>`
}
function emptyCard(dev, filtered) {
  const btn = filtered
    ? `<button type="button" class="btn mt-5 rounded-full bg-primary px-6 text-white ${T44(dev)}">ล้างตัวกรอง</button>`
    : `<a href="#" class="btn mt-5 rounded-full bg-primary px-6 text-white ${T44(dev)}">กลับไปตั้งค่าเพจ</a>`
  return `<div class="card">${cardHeader(dev, filtered ? { status: 'ล้มเหลว', event: 'ซื้อ (Purchase)' } : {})}
    <div class="card-body flex flex-col items-center py-10 text-center">
      ${IC(filtered ? 'filter-off' : 'history', 56, 'mb-4 text-d400')}
      <p class="mb-1 text-base font-semibold text-d700">${filtered ? 'ไม่พบรายการที่ตรงกับตัวกรอง' : 'ยังไม่มีบันทึกการส่ง'}</p>
      ${filtered ? '' : '<p class="mt-1 max-w-xs text-sm text-d700">เมื่อมีเหตุการณ์จากแชทของเพจนี้ จะขึ้นที่นี่ภายใน 1–2 นาที</p>'}
      ${btn}</div></div>`
}
const wrap = (dev, inner) => `<div class="${dev.k === 'm' ? 'p-4' : 'p-5'}">${inner}</div>`

let html = ''
html += section('sn', 'n', '1) ปกติ — 10 รายการ (ตัดจากชุดแรก 20 รายการ)', [
  'Desktop = ตาราง Paces 8 คอลัมน์: เวลา · ลูกค้า (รูป 32px + ชื่อ / "–") · เหตุการณ์ (+ ลิงก์ "ออเดอร์ #…" ใต้ชื่อ) · โฆษณา (รูป 32px + ชื่อตัด … + "คลิกเมื่อ …" / "–") · ชุดข้อมูล · มูลค่า (ชิดขวา) · สถานะ · เหตุผล (แดงเมื่อล้มเหลว)',
  'Tablet 768 + Mobile 390 = การ์ดรายการ (DataTable สลับเป็นตารางที่ lg = 1024px) · Tablet เวลา · ชุดข้อมูล · มูลค่า อยู่บรรทัดเดียว · Mobile เวลาบรรทัดแรก ชุดข้อมูล · มูลค่า บรรทัดถัดไป',
  'ลิงก์ออเดอร์บนการ์ดสูง 44px (min-h-11) · บรรทัดแอดตัด … ทั้งบรรทัด + title · แอด "หมวกกันน็อค ลดทั้งร้าน" ไม่มีรูป = ช่องไอคอน speakerphone · ลูกค้าไม่มีข้อมูล: ตาราง "–" · การ์ดไม่มีรูป ชื่อเหตุการณ์ขึ้นเป็นบรรทัดหลัก',
], row3((d) => shell(d, logCard(d))))
html += section('se', 'e', '2) ว่าง / ไม่ตรงตัวกรอง (เฉพาะการ์ด)', [
  'ว่าง: ไอคอน history + "ยังไม่มีบันทึกการส่ง" + คำอธิบาย + ปุ่ม "กลับไปตั้งค่าเพจ" (SellerEmptyState compact)',
  'ไม่ตรงตัวกรอง: ปุ่มตัวกรองที่เลือกอยู่ขึ้นกรอบ primary + ชื่อค่าที่เลือก · ไอคอน filter-off + ปุ่ม "ล้างตัวกรอง" ไม่มีคำอธิบาย',
], `<div class="space-y-10">${row3((d) => wrap(d, emptyCard(d, false)))}${row3((d) => wrap(d, emptyCard(d, true)))}</div>`)

document.getElementById('app').innerHTML = html
const tabs = document.querySelectorAll('.tabbtn')
function show(g) {
  tabs.forEach((b) => b.setAttribute('aria-selected', String(b.dataset.show === g)))
  document.querySelectorAll('section[data-group]').forEach((s) => { s.hidden = !(g === 'all' || s.dataset.group === g) })
}
tabs.forEach((b) => b.addEventListener('click', () => show(b.dataset.show)))
show('n')
const redrawIcons = () => document.querySelectorAll('iconify-icon').forEach((i) => {
  if (i.shadowRoot && !i.shadowRoot.querySelector('svg')) i.replaceWith(i.cloneNode(true))
})
;[800, 2000, 4000].forEach((t) => setTimeout(redrawIcons, t))
document.getElementById('themeBtn').addEventListener('click', () => {
  const h = document.documentElement
  h.dataset.theme = h.dataset.theme === 'dark' ? 'light' : 'dark'
})
</script>
</body>
</html>
