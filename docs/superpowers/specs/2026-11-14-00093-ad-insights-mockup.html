// ── ③ ตารางคุณภาพแชทรายแอด (FR-005) ──
function qualRows(group) {
  const base = ADS.filter((a) => a.meta || a.deep > 0)
  if (group === 'ad') return base
  const by = new Map()
  for (const a of base) {
    const k = a.camp ?? 'ไม่พบใน Insights'
    if (!by.has(k)) by.set(k, { name: k, camp: null, set: null, img: null, isCamp: true, n: 0, deep: 0, orders: 0, meta: a.meta ? { imp: 0, reach: 0, clk: 0, chats: 0, d2: 0, d3: 0, rep: 0, block: 0 } : null, v: null })
    const g = by.get(k); g.n++; g.deep += a.deep; g.orders += a.orders
    if (a.meta && g.meta) for (const f of Object.keys(g.meta)) g.meta[f] += a.meta[f]
    if (a.v) { g.v = g.v ?? [0, 0, 0, 0, 0]; a.v.forEach((x, i) => (g.v[i] += x)) }
  }
  return [...by.values()]
}
function qcells(a) {
  const o = ok(), m = o ? a.meta : null
  const r = (f) => (m ? div(m[f], m.chats) : null)
  const raw = (f) => (m ? `${num(m[f])} แชท` : '')
  return {
    imp: m ? num(m.imp) : DASH, ctr: m ? pct((m.clk / m.imp) * 100, 2) : '',
    chats: m ? num(m.chats) : DASH,
    d2: fmtPct(r('d2')), d2r: raw('d2'), d3: fmtPct(r('d3')), d3r: raw('d3'),
    rep: fmtPct(r('rep')), repr: raw('rep'), block: fmtPct(r('block')), blockr: raw('block'),
    blockHi: m && r('block') >= 0.05,
    close: fmtPct(div(a.orders, a.deep)), closer: `${a.orders} ใบ / ${num(a.deep)} แชท`,
  }
}

  if (!ok() || !a.meta) return DASH
  if (!a.v) return '<span class="text-2xs text-d600">ไม่ใช่วิดีโอ</span>'

  const bars = [p25, p50, p75, p100].map((p, i) => `<span class="flex flex-col items-center gap-0.5"><span class="flex h-6 w-2.5 items-end overflow-hidden rounded-sm bg-d100"><span class="w-full rounded-sm bg-primary" style="height:${Math.round(p * 400)}%"></span></span>${compact ? '' : `<span class="text-2xs text-d600">${[25, 50, 75, 100][i]}</span>`}</span>`).join('') // mockup: แท่งขยาย 4 เท่าให้อ่านออก
  return `<span class="inline-flex items-end gap-2" title="ดู 25% ${pct(p25 * 100)} · 50% ${pct(p50 * 100)} · 75% ${pct(p75 * 100)} · จบ ${pct(p100 * 100)} ของการแสดงผล"><span class="inline-flex items-end gap-0.5" aria-hidden="true">${bars}</span>
    <span class="text-start"><span class="block font-semibold text-d900">${pct(thru * 100)}</span><span class="block text-2xs text-d600">ThruPlay</span></span></span>`
}

          <div class="rounded bg-d50 p-1.5"><dt class="text-d600">แชท Meta</dt><dd class="font-semibold tabular-nums text-d900">${x.chats}</dd></div>
          <div class="rounded bg-d50 p-1.5"><dt class="text-d600">คุยต่อ ≥3</dt><dd class="font-semibold tabular-nums text-d900">${x.d3}</dd></div>
          <div class="rounded bg-d50 p-1.5"><dt class="text-d600">บล็อก</dt><dd class="font-semibold tabular-nums ${x.blockHi ? 'text-warning-ink' : 'text-d900'}">${x.block}</dd></div>
          <div class="rounded bg-primary10 p-1.5"><dt class="text-d600">ปิดการขาย</dt><dd class="font-semibold tabular-nums text-d900">${x.close}</dd></div></dl>
        ${a.v && ok() ? `<div class="mt-2 text-2xs">${video(a, true)}</div>` : ''}</li>` }
    return `<div class="card"><div class="card-header">${head}</div><ul class="divide-y divide-d200 px-4">${rows.map(li).join('')}</ul>${notes}</div>`
  }
  const two = (top, sub, cls = 'text-d900') => `<span class="block ${cls}">${top}</span>${sub ? `<span class="block text-2xs text-d600">${sub}</span>` : ''}`
  const tr = (a) => { const x = qcells(a)
    return `<tr class="border-t border-d200 hover:bg-d100">
      <td class="max-w-0 py-2.5 pe-2 ps-5"><span class="flex min-w-0 items-center gap-2.5">${a.isCamp ? `<span class="flex size-9 shrink-0 items-center justify-center rounded bg-d200 text-d600">${IC('folder', 16)}</span>` : thumb(a)}<span class="min-w-0">${name(a)}</span></span></td>
      <td class="px-2 text-center tabular-nums">${two(x.imp, x.ctr ? 'CTR ' + x.ctr : '')}</td>
      <td class="px-2 text-center font-semibold tabular-nums text-d900">${x.chats}</td>
      <td class="px-2 text-center tabular-nums">${two(x.d2, x.d2r)}</td>
      <td class="px-2 text-center tabular-nums">${two(x.d3, x.d3r)}</td>
      <td class="px-2 text-center tabular-nums">${two(x.rep, x.repr)}</td>
      <td class="px-2 text-center tabular-nums">${two(x.block, x.blockr, x.blockHi ? 'font-semibold text-warning-ink' : 'text-d900')}</td>
      <td class="bg-primary10 px-2 text-center tabular-nums">${two(x.close, x.closer, 'font-semibold text-d900')}</td>
      <td class="pe-5 ps-2">${video(a, false)}</td></tr>` }
  const th = (t, cls = 'text-center') => `<th class="px-2 py-2.5 ${cls} align-bottom font-semibold">${t}</th>`
  return `<div class="card"><div class="card-header">${head}</div>
    <div class="overflow-x-auto"><table class="w-full table-fixed whitespace-nowrap text-sm ${dev.k === 't' ? 'min-w-[980px]' : ''}">
      <colgroup><col style="width:24%"/><col/><col/><col/><col/><col/><col/><col/><col style="width:12%"/></colgroup>
      <thead class="bg-d100 text-xs text-d700">
        <tr class="text-2xs"><th></th><th colspan="6" class="border-b border-d300 px-2 pt-2 text-center font-semibold">${srcBadge('Meta')}</th><th class="border-b border-d300 bg-primary10 px-2 pt-2 text-center">${srcBadge('Deep')}</th><th class="border-b border-d300 pt-2 text-center">${srcBadge('Meta')}</th></tr>
        <tr><th class="py-2.5 pe-2 ps-5 text-start align-bottom font-semibold">${g === 'camp' ? 'แคมเปญ' : 'โฆษณา'}</th>${th('การแสดงผล')}${th('แชท (Meta)')}${th('คุยต่อ ≥2')}${th('คุยต่อ ≥3')}${th('ตอบกลับ')}${th('บล็อก')}${th('ปิดการขาย')}${th('ดูวิดีโอ', 'pe-5 text-start')}</tr></thead>
      <tbody>${rows.map(tr).join('')}</tbody></table></div>${notes}</div>`
}

// ── ④ แพลตฟอร์มและตำแหน่ง (FR-006) ──
function adSelect(dev) {
  return `<select class="form-select w-full sm:w-56 ${btnH(dev)}" aria-label="เลือกแอด"><option>ทุกแอด</option>${COV.map((a) => `<option>${adLabel(a)}</option>`).join('')}</select>`
}
function cardPlace(dev) {
  const head = `<h4 class="card-title flex items-center gap-2">แพลตฟอร์มและตำแหน่ง ${estBadge}</h4>${adSelect(dev)}`
  const noSales = `<p class="flex items-start gap-1.5 px-5 pb-3 pt-3 text-2xs text-d600">${IC('info-circle', 14, 'mt-px text-d500')}<span>Deep รู้ว่าแชทมาจากแอดไหน แต่ไม่รู้ว่าลูกค้าเห็นแอดที่ตำแหน่งไหน จึงแยกยอดขายตามตำแหน่งไม่ได้ · ตัวเลขแยกตำแหน่งเป็นค่าประมาณของ Meta ผลรวมอาจไม่เท่ายอดรวมด้านบน</span></p>`
  if (!ok()) return `<div class="card h-full"><div class="card-header">${head}</div>${cardState('NOT_CONNECTED')}</div>`
  if (S.st === 'NA') return `<div class="card h-full"><div class="card-header">${head}</div>${cardState('NA')}</div>`
  const best = Math.min(...PLACE.filter((p) => p.chats >= 20).map((p) => p.spend / p.chats))
  const name = (p) => `<span class="flex min-w-0 items-center gap-2">${IC(p.i, 16)}<span class="truncate font-medium text-d900">${p.n}</span></span>`
  if (dev.k === 'm') {
    return `<div class="card"><div class="card-header">${head}</div><ul class="divide-y divide-d200 px-4">${PLACE.map((p) => { const cpc = div(p.spend, p.chats)
      return `<li class="py-3"><div class="flex items-center justify-between gap-2">${name(p)}<span class="shrink-0 text-end"><span class="block font-semibold tabular-nums text-d900">${EST}${cpc == null ? '—' : baht(cpc)}</span><span class="block text-2xs text-d600">ต่อแชท (Meta)</span></span></div>
        <p class="mt-1 text-2xs tabular-nums text-d600">ค่าโฆษณา ${EST}${baht(p.spend)} · แชท ${EST}${num(p.chats)} · แสดงผล ${EST}${num(p.imp)}</p>
        <div class="mt-1.5">${bar((p.chats / PLACE_CHATS) * 100)}</div>${cpc === best ? `<span class="badge mt-1.5 bg-success15 text-success-ink">${IC('trending-down', 12)}ต้นทุนต่อแชทต่ำสุด</span>` : ''}</li>` }).join('')}</ul>${noSales}</div>`
  }
  const tr = (p) => { const cpc = div(p.spend, p.chats)
    return `<tr class="border-t border-d200"><td class="max-w-0 py-2.5 pe-2 ps-5">${name(p)}</td>
      <td class="px-2 text-center tabular-nums text-d900">${EST}${baht(p.spend)}</td><td class="px-2 text-center tabular-nums text-d900">${EST}${num(p.imp)}</td>
      <td class="px-2 text-center tabular-nums text-d900">${EST}${num(p.clk)}</td><td class="px-2 text-center tabular-nums text-d900">${EST}${num(p.chats)}</td>
      <td class="px-2 text-center tabular-nums"><span class="font-semibold text-d900">${EST}${cpc == null ? '—' : baht(cpc)}</span>${cpc === best ? `<span class="badge ms-1 bg-success15 text-success-ink">ต่ำสุด</span>` : p.chats < 20 ? `<span class="block text-2xs text-d600">แชทน้อย</span>` : ''}</td>
      <td class="pe-5 ps-2"><span class="flex items-center gap-2"><span class="flex-1">${bar((p.chats / PLACE_CHATS) * 100)}</span><span class="w-10 text-end text-2xs tabular-nums text-d700">${pct((p.chats / PLACE_CHATS) * 100, 0)}</span></span></td></tr>` }
  const th = (t) => `<th class="px-2 py-2.5 text-center align-bottom font-semibold">${t}</th>`
  return `<div class="card h-full"><div class="card-header">${head}</div><div class="overflow-x-auto"><table class="w-full table-fixed whitespace-nowrap text-sm ${dev.k === 't' ? 'min-w-[720px]' : ''}">
    <colgroup><col style="width:24%"/><col/><col/><col/><col/><col/><col style="width:18%"/></colgroup>
    <thead class="bg-d100 text-xs text-d700"><tr><th class="py-2.5 pe-2 ps-5 text-start font-semibold">ตำแหน่ง</th>${th('ค่าโฆษณา')}${th('การแสดงผล')}${th('คลิก')}${th('แชท (Meta)')}${th('ต้นทุนต่อแชท')}<th class="pe-5 ps-2 text-start font-semibold">สัดส่วนแชท</th></tr></thead>
    <tbody>${PLACE.map(tr).join('')}</tbody></table></div>${noSales}</div>`
}

// ── ⑤ อายุและเพศ (FR-007) ──
const METRICS = [['chats', 'แชท (Meta)'], ['imp', 'การแสดงผล'], ['spend', 'ค่าโฆษณา']]
function cardAge(dev) {
  const k = dev.k, mt = S.metric[k]
  const seg = `<div class="inline-flex" role="group" aria-label="ตัวชี้วัด">${METRICS.map(([v, l], i) => `<button type="button" data-metric="${v}" data-dev="${k}" aria-pressed="${mt === v}" class="chip btn btn-sm ${btnH(dev)} ${i === 0 ? 'rounded-e-none' : i === 2 ? 'rounded-s-none' : 'rounded-none'}">${l}</button>`).join('')}</div>`
  const head = `<h4 class="card-title flex items-center gap-2">อายุและเพศ ${estBadge}</h4><div class="flex w-full flex-wrap items-center gap-2">${seg}${adSelect(dev)}</div>`
  const note = `<p class="flex items-start gap-1.5 px-5 pb-3 text-2xs text-d600">${IC('info-circle', 14, 'mt-px text-d500')}<span>Deep ไม่มีอายุ/เพศของลูกค้า ตัวเลขนี้คือคนที่ Meta แสดงแอดให้และที่เริ่มแชท ไม่ใช่ผู้ซื้อ · ค่าประมาณของ Meta</span></p>`
  let body
  if (!ok()) body = cardState('NOT_CONNECTED')
  else if (S.st === 'NA') body = cardState('NA')
  else if (S.st === 'ERROR') body = cardState('ERROR')
  else {
    const row = (i) => { const c = AGE.chats.m[i] + AGE.chats.f[i] + AGE.chats.u[i], s = AGE.spend.m[i] + AGE.spend.f[i] + AGE.spend.u[i]; return { c, s } }
    const tot = AGES.reduce((a, _, i) => a + row(i).c, 0)
    body = `<div class="px-3 pt-2"><div id="age-${k}" style="min-height:240px"></div></div>
      <div class="px-5 pb-3"><table class="w-full text-xs tabular-nums"><thead class="text-d600"><tr><th class="py-1 text-start font-medium">อายุ</th><th class="text-end font-medium">แชท (Meta)</th><th class="text-end font-medium">ต่อแชท</th><th class="text-end font-medium">สัดส่วน</th></tr></thead>
      <tbody>${AGES.map((a, i) => { const r = row(i); return `<tr class="border-t border-d200"><td class="py-1.5 text-d900">${a}</td><td class="text-end text-d900">${EST}${num(r.c)}</td><td class="text-end text-d900">${EST}${baht(r.s / r.c)}</td><td class="text-end text-d700">${pct((r.c / tot) * 100, 0)}</td></tr>` }).join('')}</tbody></table></div>`
  }
  return `<div class="card h-full"><div class="card-header">${head}</div>${body}${ok() && S.st === 'OK' ? note : ''}</div>`
}

// ── โครงหน้า ──
function sideNav() {
  const it = (i, l, a) => `<li class="flex items-center gap-2.5 rounded px-3 py-2 text-sm ${a ? 'bg-primary15 font-medium text-primary-ink' : 'text-d700'}">${IC(i, 18)}${l}</li>`
  return `<aside class="w-[260px] shrink-0 border-e border-d200 bg-card px-3 py-4">
    <div class="mb-4 px-3 text-lg font-bold text-d900">Deep</div>
    <p class="px-3 pb-1 text-2xs font-semibold text-d500">เมนูหลัก</p>
    <ul class="mb-3 space-y-0.5">${it('home', 'หน้าหลัก')}${it('message-circle', 'ข้อความ')}${it('shopping-cart', 'คำสั่งซื้อ')}${it('package', 'สินค้า')}${it('users', 'ลูกค้า')}</ul>
    <p class="px-3 pb-1 text-2xs font-semibold text-d500">รายงาน</p>
    <ul class="space-y-0.5">${it('chart-bar', 'ยอดขายรายสินค้า')}${it('speakerphone', 'ยอดขายตามโฆษณา', 1)}${it('report-money', 'กำไรขาดทุน')}</ul></aside>`
}
const BOTTOM = [['home', 'หน้าหลัก'], ['message-circle', 'แชท'], ['shopping-cart', 'ออเดอร์'], ['package', 'สินค้า'], ['menu-2', 'เมนู']]
function page(dev) {
  const k = dev.k
  const G = cardGap(dev), A = cardAge(dev), Q = cardQuality(dev), P = cardPlace(dev)
  const g = (cls, items) => `<div class="mb-5 grid gap-5 [&>*]:min-w-0 ${cls}">${items.join('')}</div>`
  const sp = (n, x) => `<div class="${n}">${x}</div>`
  let grid
  if (k === 'd') grid = kpis(dev) + g('grid-cols-12', [sp('col-span-7', G), sp('col-span-5', A)]) + g('grid-cols-1', [Q]) + g('grid-cols-1', [P])
  else if (k === 't') grid = kpis(dev) + g('grid-cols-1', [G, Q, P, A])
  else grid = kpis(dev) + `<div class="grid grid-cols-1 gap-3 [&>*]:min-w-0">${[G, Q, P, A].join('')}</div>`
  if (k === 'd') {
    return `<div class="flex">${sideNav()}<div class="min-w-0 flex-1">
      <div class="flex h-[65px] items-center border-b border-d200 bg-card px-5">${IC('menu-2', 20, 'text-d700')}<span class="ms-auto flex items-center gap-4">${IC('bell', 20, 'text-d700')}<img src="${photo(30)}" alt="" class="size-8 rounded-full" /></span></div>
      <div class="p-5"><nav aria-label="breadcrumb" class="mb-1 flex items-center gap-1.25 text-xs font-medium text-d600">หน้าหลัก ${IC('chevron-right', 12)} รายงาน ${IC('chevron-right', 12)} <span class="text-d700">ยอดขายตามโฆษณา</span></nav><h3 class="mb-3 text-lg font-semibold text-d900">ยอดขายตามโฆษณา</h3>
      ${tabs(dev)}${controls(dev)}${notice(dev)}${grid}</div></div></div>`
  }
  return `<div class="flex min-h-14 items-center gap-2 border-b border-d200 bg-card px-2"><button type="button" aria-label="ย้อนกลับ" class="flex size-11 items-center justify-center text-d700">${IC('arrow-left', 20)}</button><span class="text-md font-semibold text-d900">ยอดขายตามโฆษณา</span></div>
    <div class="p-4">${tabs(dev)}${controls(dev)}${notice(dev)}${grid}</div>
    <nav class="grid h-[72px] grid-cols-5 items-center border-t border-d200 bg-card">${BOTTOM.map(([i, l]) => `<span class="flex flex-col items-center gap-0.5 text-2xs ${l === 'เมนู' ? 'font-medium text-primary-ink' : 'text-d600'}">${IC(i, 22)}${l}</span>`).join('')}</nav>`
}
function frame(dev, inner) {
  return `<div class="shrink-0"><div class="mb-2 flex items-center gap-2 text-xs font-semibold text-d700">${IC(dev.k === 'm' ? 'device-mobile' : dev.k === 't' ? 'device-tablet' : 'device-desktop', 16)}${dev.label}</div><div class="frame" style="width:${dev.w}px">${inner}</div></div>`
}

// ── กราฟ (ของจริงผ่าน ApexChart wrapper + getColor('chart-*')) ──
let CHARTS = []
function drawCharts() {
  CHARTS.forEach((c) => c.destroy()); CHARTS = []
  if (S.st !== 'OK') return
  for (const { k } of DEVS) {
    const el = document.getElementById(`age-${k}`)
    if (!el) continue
    const mt = S.metric[k], d = AGE[mt]
    const fmt = (v) => (mt === 'spend' ? baht(v) : num(v))
    const ch = new ApexCharts(el, {
      chart: { type: 'bar', height: 240, toolbar: { show: false }, fontFamily: 'Anuphan, sans-serif', foreColor: cssv('d600'), background: 'transparent', animations: { enabled: false } },
      series: [{ name: 'ชาย', data: d.m }, { name: 'หญิง', data: d.f }, { name: 'ไม่ระบุ', data: d.u }],
      colors: [C.primary, C.zeta, cssv('d400')],
      plotOptions: { bar: { horizontal: true, barHeight: '70%', borderRadius: 2 } },
      xaxis: { categories: AGES, labels: { formatter: (v) => (mt === 'spend' ? (v >= 1000 ? '฿' + v / 1000 + 'k' : '฿' + v) : v >= 1000 ? v / 1000 + 'k' : v), style: { fontSize: '11px' } }, axisBorder: { show: false }, axisTicks: { show: false } },
      grid: { borderColor: cssv('d200'), strokeDashArray: 4 },
      dataLabels: { enabled: false },
      legend: { show: true, position: 'top', horizontalAlign: 'right', fontSize: '12px', markers: { size: 5 } },
      tooltip: { theme: document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light', shared: true, intersect: false, y: { formatter: (v) => '≈ ' + fmt(v) } },
    })
    ch.render(); CHARTS.push(ch)
  }
}

// ── วาด ──
function renderNav() {
  document.getElementById('stNav').innerHTML = STATES.map(([v, l]) => `<button type="button" role="tab" class="tabbtn btn btn-sm border border-d300 text-d800" data-st="${v}" aria-selected="${S.st === v}">${l}</button>`).join('')
  document.querySelectorAll('[data-st]').forEach((b) => b.addEventListener('click', () => { S.st = b.dataset.st; renderNav(); render() }))
}
function render() {
  const label = STATES.find(([v]) => v === S.st)[1]
  CHARTS.forEach((c) => c.destroy()); CHARTS = []
  document.getElementById('app').innerHTML = `<section>
    <h2 class="mb-1 text-lg font-bold text-d900">/reports/ads?tab=quality — สถานะ: ${label}</h2>
    <ul class="mb-4 max-w-[1500px] list-disc ps-5 text-xs text-d700">
      <li>แท็บใหม่ "คุณภาพโฆษณา" ข้างแท็บ "ยอดขาย" (ของเดิม 9 การ์ดไม่เปลี่ยน) · ช่วงวันที่และเพจใช้ร่วมกัน · ดึง Meta เฉพาะตอนเปิดแท็บนี้</li>
      <li>ป้าย Meta / Deep บอกแหล่งของทุกตัวเลข · ≈ และป้าย "ประมาณการ" = ค่าประมาณของ Meta · "—" = ไม่ทราบ (ไม่ใช่ 0)</li>
      <li>ตำแหน่ง และ อายุ/เพศ ไม่มียอดขายโดยตั้งใจ (BR-AIQ-02) · สีส้ม #db9052 = ตัวแทน <code>getColor('chart-zeta')</code> ในม็อกอัพเท่านั้น</li>
    </ul>
    <div class="space-y-10">${DEVS.map((d) => frame(d, page(d))).join('')}</div></section>`
  document.querySelectorAll('[data-group]').forEach((b) => b.addEventListener('click', () => { S.group[b.dataset.dev] = b.dataset.group; render() }))
  document.querySelectorAll('[data-metric]').forEach((b) => b.addEventListener('click', () => { S.metric[b.dataset.dev] = b.dataset.metric; render() }))
  clearTimeout(window.__dc); window.__dc = setTimeout(drawCharts, 120)
}
document.getElementById('themeBtn').addEventListener('click', () => {
  const h = document.documentElement
  h.dataset.theme = h.dataset.theme === 'dark' ? 'light' : 'dark'
  drawCharts()
})
renderNav()
render()
</script>
</body>
</html>
