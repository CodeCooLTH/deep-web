<script>
const IC = (n, s = 12, c = '') => `<iconify-icon icon="${n.includes(':') ? n : 'tabler:' + n}" width="${s}" height="${s}" class="${c}" noobserver aria-hidden="true"></iconify-icon>`

]
const S = { st: 'OK', tab: { d: 'spend', t: 'sales', m: 'roas' }, sort: 'sales' }
const ok = () => S.st === 'OK'
const ACCOUNT = 'Deep Ads – ธนภัทร์'

function photo(h) {
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' fill='hsl(${h},45%,55%)'/><circle cx='20' cy='16' r='7' fill='hsl(${h},40%,88%)'/><ellipse cx='20' cy='37' rx='13' ry='10' fill='hsl(${h},40%,88%)'/></svg>`
  return 'data:image/svg+xml,' + encodeURIComponent(svg)
}
function prodImg(kind) {
  const bg = { wheel: '#2b2f36', shock: '#3d4f63', led: '#1f2a44', rim: '#4a3b2a' }[kind]
  const fg = {
    wheel: "<circle cx='20' cy='20' r='14' fill='none' stroke='%23cfd6de' stroke-width='4'/><circle cx='20' cy='20' r='4' fill='%23cfd6de'/><path d='M20 8v24M8 20h24' stroke='%23cfd6de' stroke-width='2'/>",
    shock: "<rect x='17' y='6' width='6' height='28' rx='3' fill='%23f9bf59'/><path d='M13 12h14M13 17h14M13 22h14M13 27h14' stroke='%23e7e9eb' stroke-width='2'/>",
    led: "<circle cx='20' cy='20' r='11' fill='%23fff7d6'/><circle cx='20' cy='20' r='6' fill='%23ffffff'/><path d='M4 20h4M32 20h4M20 4v4M20 32v4' stroke='%23fff7d6' stroke-width='2'/>",
    rim: "<circle cx='20' cy='20' r='14' fill='none' stroke='%23e0b070' stroke-width='5'/><circle cx='20' cy='20' r='3' fill='%23e0b070'/>",
  }[kind]
  return `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='${encodeURIComponent(bg)}'/%3E${fg.replace(/</g, '%3C').replace(/>/g, '%3E')}%3C/svg%3E`
}

// ── ตัวเลข ──
const baht = (n) => '฿' + Math.round(n).toLocaleString('en-US')
const baht2 = (n) => '฿' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
const num = (n) => n.toLocaleString('en-US')
const pct = (n, d = 2) => n.toFixed(d) + '%'
const DASH = '<span class="text-d500">—</span>'
const NOSPEND = '<span class="text-d500" aria-hidden="true">—</span><span class="sr-only">ไม่มีค่าโฆษณา</span>'

// ── ข้อมูล: แอด 12 ตัวที่มีแชท/ยอด + แถวผี 2 ตัว (มีใน Insights แต่ไม่มีแชทจากแอด) ──
// spend: null = ไม่พบแถวใน Insights · ghost = แถวผี
const ADS = [
  { name: 'video 360_Group_1', id: '120214455102340219', img: 'wheel', chats: 651, orders: 180, sales: 74070, lost: 2, spend: 13500 },
  { name: 'โพสวิดีโอ คลิป 3_Group_1', id: '120214455102340301', img: 'shock', chats: 242, orders: 56, sales: 34610, lost: 2, spend: 8650 },
  { name: 'รวมโพส_Group_1', id: '120213987700120044', img: 'rim', chats: 247, orders: 38, sales: 23860, lost: 0, spend: 8320 },
  { name: 'โพสวิดีโอ แกนเงิน', id: '120214610055870112', img: 'shock', chats: 72, orders: 27, sales: 16490, lost: 0, spend: 3210 },
  { name: 'โพสวิดีโอ แกนทอง', id: '120214610055870113', img: 'rim', chats: 43, orders: 15, sales: 9830, lost: 0, spend: 2640 },
  { name: '290_Post_video_17 sec_Group_1', id: '120213458800120290', img: 'wheel', chats: 50, orders: 23, sales: 7480, lost: 1, spend: 2980 },
  { name: 'ADMD_Group_1', id: '120213458800120301', img: 'led', chats: 51, orders: 11, sales: 5190, lost: 0, spend: 3150 },
  { name: 'โพสแนวตั้ง', id: '120214777300450008', img: 'wheel', chats: 8, orders: 5, sales: 4160, lost: 0, spend: 620 },
  { name: 'โปรล้อแม็ก 11.11 วันเดียว ลด 40%', id: '120214901200330017', img: 'wheel', chats: 9, orders: 14, sales: 6240, lost: 0, spend: 2100 },
  { name: 'ไฟหน้า LED', id: '120214901200330021', img: null, chats: 5, orders: 9, sales: 3180, lost: 0, spend: 1050 },
  { name: null, id: '120213458800120219', img: null, chats: 0, orders: 4, sales: 1450, lost: 0, spend: null },
  { name: 'ล้อแม็กลดล้างสต็อก', id: '120214901200330035', img: 'rim', chats: 2, orders: 2, sales: 650, lost: 0, spend: 240 },
  { name: 'โช้คแต่ง รีวิวลูกค้า_Group_2', id: '120214990100550041', img: null, chats: 0, orders: 0, sales: 0, lost: 0, spend: 1980, ghost: true },
  { name: 'ล้อแม็ก 15 นิ้ว ยิงกว้าง', id: '120214990100550057', img: null, chats: 0, orders: 0, sales: 0, lost: 0, spend: 1160, ghost: true },
]
const REAL = ADS.filter((a) => !a.ghost)
const GHOST = ADS.filter((a) => a.ghost)
const COV = ADS.filter((a) => a.spend != null)
const sumOf = (rows, k) => rows.reduce((a, r) => a + r[k], 0)
const TOT = { chats: sumOf(ADS, 'chats'), orders: sumOf(ADS, 'orders'), sales: sumOf(ADS, 'sales'), lost: sumOf(ADS, 'lost'), spend: sumOf(COV, 'spend') } // 1,380 · 384 · 187,210 · 5 · 49,600
// HR16: ROAS/ต้นทุนรวมใช้ชุดแอดเดียวกัน = แอดที่มีค่าโฆษณา (รวมแถวผี) — ไม่นับแอดที่ไม่พบค่าโฆษณา
const COV_SALES = sumOf(COV, 'sales'), COV_ORDERS = sumOf(COV, 'orders')
TOT.roas = COV_SALES / TOT.spend // 185,760 ÷ 49,600 = 3.75
TOT.cpo = TOT.spend / COV_ORDERS // 49,600 ÷ 380 = ฿131
const UNCOVERED = ADS.length - COV.length
const GHOST_SPEND = sumOf(GHOST, 'spend') // 3,140
const NONAD = { sales: 7902, orders: 17 }
const ALL = TOT.sales + NONAD.sales
const PREV = { sales: 166557, orders: 355, chats: 1262, spend: 40823, covSales: 165120, covOrders: 351 }
PREV.roas = PREV.covSales / PREV.spend
PREV.cpo = PREV.spend / PREV.covOrders
const delta = (cur, prev) => ((cur - prev) / prev) * 100
const adLabel = (a) => a.name ?? `รหัสโฆษณา ${a.id}`
const roasOf = (sales, spend) => (spend == null || spend === 0 ? null : sales / spend)
const cpoOf = (spend, orders) => (spend == null || orders === 0 ? null : spend / orders)
console.assert(TOT.spend === 49600 && TOT.sales === 187210, 'ยอดรวมไม่ตรงที่ตั้งไว้')

// ซีรีส์รายวัน 30 วัน — ผลรวมเท่าการ์ดสรุปเป๊ะ (HR16)
const LABELS = [...Array(16)].map((_, i) => `${16 + i} ต.ค.`).concat([...Array(14)].map((_, i) => `${1 + i} พ.ย.`))
function spread(total, seed, amp = 0.35) {
  const w = LABELS.map((_, i) => Math.max(0.15, 1 + amp * Math.sin(i * 0.7 + seed) + 0.22 * Math.sin(i * 2.3 + seed * 2) + (i % 7 === 5 || i % 7 === 6 ? 0.25 : 0) + (i === 26 ? 0.9 : 0)))
  const W = w.reduce((a, b) => a + b, 0)
  const out = w.map((x) => Math.floor((x / W) * total))
  out[out.length - 1] += total - out.reduce((a, b) => a + b, 0)
  return out
}
const SER = {
  ad: spread(TOT.sales, 1), nonAd: spread(NONAD.sales, 3, 0.6), orders: spread(TOT.orders, 1.1),
  spend: spread(TOT.spend, 2, 0.15), covSales: spread(COV_SALES, 1), prevAd: spread(PREV.sales, 4), prevOrders: spread(PREV.orders, 4.2),
}
SER.roas = SER.covSales.map((s, i) => (SER.spend[i] ? +(s / SER.spend[i]).toFixed(2) : null))
console.assert(SER.spend.reduce((a, b) => a + b, 0) === TOT.spend, 'Σ daily.spend ≠ summary.spend')

// ── ชิ้นส่วน UI ──
// DeltaText: ขึ้น success-ink · ลง warning-ink (O5) · neutral = default-700 (ค่าโฆษณา/ต้นทุน — ขึ้นไม่ได้แปลว่าดีหรือแย่)
function deltaText(d, { neutral = false, unit = '%' } = {}) {
  if (d == null || !isFinite(d)) return DASH
  const up = d >= 0
  const cls = neutral ? 'text-d700' : up ? 'text-success-ink' : 'text-warning-ink'
  return `<span class="inline-flex items-center text-xs font-medium tabular-nums ${cls}">${IC(up ? 'arrow-up' : 'arrow-down', 12)}<span class="sr-only">${up ? 'เพิ่มขึ้น' : 'ลดลง'}</span>${Math.abs(d).toFixed(1)}${unit === '%' ? '%' : ' จุด'}</span>`
}

// ── ⑨ ตารางรายแอด ──
function cells(a) {
  const sp = a.spend, r = roasOf(a.sales, sp), c = cpoOf(sp, a.orders)
  return {
    rate: a.chats > 0 ? 'ปิด ' + pct((a.orders / a.chats) * 100, 1) : DASH,
    avg: a.orders > 0 ? `เฉลี่ย ${baht(a.sales / a.orders)}/ใบ` : DASH,
    spend: sp == null ? NOSPEND : baht(sp),
    cpo: c == null ? NOSPEND : baht(c),
    roas: r == null ? NOSPEND : r.toFixed(2),
  }
}
function sortedRows() {
  const key = S.sort === 'spend' ? (a) => a.spend : (a) => a.sales
  // null เรียงท้ายเสมอ
  return [...ADS].sort((x, y) => (key(x) == null) - (key(y) == null) || key(y) - key(x))
}

// ── กราฟ (ของจริงผ่าน ApexChart wrapper + getColor('chart-*')) ──
let CHARTS = []
function base(type, h) {
  return {
    chart: { type, height: h, toolbar: { show: false }, fontFamily: 'Anuphan, sans-serif', foreColor: cssv('d600'), background: 'transparent', animations: { enabled: false } },
    grid: { borderColor: cssv('d200'), strokeDashArray: 4, padding: { top: -10, right: 0, bottom: -6, left: 6 } },
    dataLabels: { enabled: false }, legend: { show: false },
    tooltip: { theme: document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light', shared: true, intersect: false },
    xaxis: { categories: LABELS, tickAmount: 6, labels: { rotate: 0, hideOverlappingLabels: true, style: { fontSize: '11px' } }, axisBorder: { show: false }, axisTicks: { show: false } },
  }
}
const kfmt = (v) => (v >= 1000 ? '฿' + (v / 1000).toFixed(v >= 10000 ? 0 : 1) + 'k' : '฿' + Math.round(v))
const legendTop = { show: true, position: 'top', horizontalAlign: 'right', fontSize: '12px', markers: { size: 5 } }
function drawCharts() {
  CHARTS.forEach((c) => c.destroy()); CHARTS = []
  const mk = (id, o) => { const el = document.getElementById(id); if (el) { const c = new ApexCharts(el, o); c.render(); CHARTS.push(c) } }
  for (const dev of DEVS) {
    const k = dev.k, m = k === 'm'
    const x = { ...base('bar', 0).xaxis, tickAmount: m ? 4 : 6 }
    // ① แท่งซ้อนรายวัน (chart-primary + chart-delta)
    mk(`c1-${k}`, { ...base('bar', 240), chart: { ...base('bar', 240).chart, stacked: true }, xaxis: x,
      series: [{ name: 'จากโฆษณา', data: SER.ad }, { name: 'ไม่ได้มาจากโฆษณา', data: SER.nonAd }],
      colors: [C.primary, cssv('d300')], plotOptions: { bar: { columnWidth: '55%', borderRadius: 2 } },
      legend: { show: true, position: 'bottom', fontSize: '12px', markers: { size: 5 } },
      yaxis: { labels: { formatter: kfmt, style: { fontSize: '11px' } }, tickAmount: 3 },
      tooltip: { ...base('bar', 0).tooltip, y: { formatter: (v) => baht(v) } } })
    // ④ ตามแท็บ
    const t = S.tab[k]
    if (!(['spend', 'roas'].includes(t) && !ok())) {
      const o = { ...base('area', 300), xaxis: x, stroke: { width: [2, 2], dashArray: [0, 5], curve: 'smooth' },
        fill: { type: ['gradient', 'solid'], opacity: [1, 0], gradient: { opacityFrom: 0.35, opacityTo: 0, stops: [0, 95] } }, legend: legendTop }
      if (t === 'sales') Object.assign(o, { series: [{ name: 'ช่วงนี้', data: SER.ad }, { name: 'ช่วงก่อนหน้า', data: SER.prevAd }], colors: [C.primary, cssv('d400')], yaxis: { min: 0, tickAmount: 3, labels: { formatter: kfmt } }, tooltip: { ...o.tooltip, y: { formatter: (v) => baht(v) } } })
      if (t === 'orders') Object.assign(o, { series: [{ name: 'ช่วงนี้', data: SER.orders }, { name: 'ช่วงก่อนหน้า', data: SER.prevOrders }], colors: [C.primary, cssv('d400')], yaxis: { min: 0, tickAmount: 3, labels: { formatter: (v) => Math.round(v) } } })
      // ค่าโฆษณา: area ยอดขาย chart-primary + line ค่าโฆษณา stroke 3 chart-zeta (ฐาน ProjectPerformance.tsx)
      if (t === 'spend') Object.assign(o, { chart: { ...o.chart, type: 'line' }, series: [{ name: 'ยอดขายจากโฆษณา', type: 'area', data: SER.ad }, { name: 'ค่าโฆษณา', type: 'line', data: SER.spend }], stroke: { width: [2, 3], dashArray: [0, 0], curve: 'smooth' }, colors: [C.primary, C.zeta], yaxis: { min: 0, tickAmount: 3, labels: { formatter: kfmt } }, tooltip: { ...o.tooltip, y: { formatter: (v) => baht(v) } } })
      // ROAS: line chart-primary + เส้นคงที่ 1 ประ default-400 (เป็น series ไม่ใช่ annotations)
      if (t === 'roas') Object.assign(o, { chart: { ...o.chart, type: 'line' }, series: [{ name: 'ROAS รายวัน', data: SER.roas }, { name: 'ROAS 1 = ยอดขายเท่าค่าโฆษณา', data: LABELS.map(() => 1) }], stroke: { width: [3, 2], dashArray: [0, 5], curve: 'smooth' }, fill: { type: 'solid', opacity: 1 }, colors: [C.primary, cssv('d400')], yaxis: { min: 0, tickAmount: 3, labels: { formatter: (v) => v.toFixed(1) } }, tooltip: { ...o.tooltip, y: { formatter: (v) => (v == null ? '—' : v.toFixed(2)) } } })
      mk(`c4-${k}`, o)
    }
    // ⑤ donut
    const D = donutData()
    mk(`c5-${k}`, { chart: { type: 'donut', height: 180, fontFamily: 'Anuphan, sans-serif', foreColor: cssv('d600'), animations: { enabled: false } }, series: D.series, labels: D.labels, colors: D.alphas.map((a) => (a ? primaryA(a) : cssv('d400'))), legend: { show: false }, stroke: { width: 0 }, dataLabels: { enabled: false },
      tooltip: { y: { formatter: (v) => baht(v) } },
      plotOptions: { pie: { donut: { size: '75%', labels: { show: true, name: { fontSize: '12px' }, value: { fontSize: '16px', fontWeight: 600, color: cssv('d900'), formatter: (v) => baht(+v) }, total: { show: true, showAlways: true, label: 'ยอดจากโฆษณา', fontSize: '12px', color: cssv('d600'), formatter: () => baht(TOT.sales) } } } } } })
  }
}

// ── วาด ──
function renderNav() {
  document.getElementById('stNav').innerHTML = STATES.map(([v, l]) => `<button type="button" role="tab" class="tabbtn btn btn-sm border border-d300 text-d800" data-st="${v}" aria-selected="${S.st === v}">${l}</button>`).join('')
  document.querySelectorAll('[data-st]').forEach((b) => b.addEventListener('click', () => { S.st = b.dataset.st; renderNav(); render() }))
}
function render() {
  const label = STATES.find(([v]) => v === S.st)[1]
  // ทำลายกราฟเก่าก่อนแทน DOM — ไม่งั้น ApexCharts วาดซ้ำบน node ที่หลุดแล้ว (width NaN)
  CHARTS.forEach((c) => c.destroy()); CHARTS = []
  document.getElementById('app').innerHTML = `<section>
    <h2 class="mb-1 text-lg font-bold text-d900">/reports/ads — สถานะ: ${label}</h2>
    <ul class="mb-4 max-w-[1500px] list-disc ps-5 text-xs text-d700">
      <li>เฟส 2 เพิ่ม: บรรทัดบัญชีโฆษณาใต้ช่วงวันที่ · แบนเนอร์ AdSpendNotice ตามสถานะ · แท็บ ④ ค่าโฆษณา/ROAS · แถวต้นทุนต่อคำสั่งซื้อใน ② · ROAS ดีที่สุดใน ③ · 2 คอลัมน์การตลาดใน ⑨</li>
      <li>สถานะ ≠ OK: ไม่มีแถวต้นทุนใน ② · ไม่มีแถว ROAS ใน ③ · ⑨ เหลือ 5 คอลัมน์ · แท็บ 3–4 ใน ④ กดได้แต่แสดงข้อความแทนกราฟ</li>
      <li>สีส้ม #db9052 ในกราฟค่าโฆษณา = ตัวแทน <code>getColor('chart-zeta')</code> ในม็อกอัพเท่านั้น · แท็บ ④ กดสลับได้ทุกจอ</li>
    </ul>
    <div class="space-y-10">${DEVS.map((d) => frame(d, page(d))).join('')}</div></section>`
  document.querySelectorAll('[data-kpi]').forEach((b) => b.addEventListener('click', () => { S.tab[b.dataset.dev] = b.dataset.kpi; render() }))
  document.querySelectorAll('[data-ghostsort]').forEach((b) => b.addEventListener('click', () => { S.sort = S.sort === 'spend' ? 'sales' : 'spend'; render() }))
  // Tailwind CDN สร้าง CSS หลัง DOM เปลี่ยน — รอ layout นิ่งก่อนวัดความกว้างกราฟ
  clearTimeout(window.__dc); window.__dc = setTimeout(drawCharts, 120)
}
document.getElementById('themeBtn').addEventListener('click', () => {
  const h = document.documentElement
  h.dataset.theme = h.dataset.theme === 'dark' ? 'light' : 'dark'
  drawCharts()
})
renderNav()
render()
</script>
</body>
</html>
