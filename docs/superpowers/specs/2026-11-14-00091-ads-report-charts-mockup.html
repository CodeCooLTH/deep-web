  // โครงโทเคนลอกจากม็อกอัพ 00078 (สกิน Paces) — ทุกสีชี้ CSS variable ที่สลับตาม data-theme

    theme: {

<script>
const IC = (n, s = 12, c = '') => `<iconify-icon icon="${n.includes(':') ? n : 'tabler:' + n}" width="${s}" height="${s}" class="${c}" noobserver aria-hidden="true"></iconify-icon>`
const DEVS = [
  { k: 'd', w: 1440, label: 'Desktop 1440' },
  { k: 't', w: 768, label: 'Tablet 768' },
  { k: 'm', w: 390, label: 'Mobile 390' },
]
const S = { conn: true, tab: { d: 'sales', t: 'sales', m: 'sales' } }

// ── รูปตัวอย่าง (SVG) ลอกจากม็อกอัพ 00091 ฉบับแรก ──
function photo(h) {
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' fill='hsl(${h},45%,55%)'/><circle cx='20' cy='16' r='7' fill='hsl(${h},40%,88%)'/><ellipse cx='20' cy='37' rx='13' ry='10' fill='hsl(${h},40%,88%)'/></svg>`
  return 'data:image/svg+xml,' + encodeURIComponent(svg)
}
function prodImg(kind) {
  const bg = { wheel: '#2b2f36', shock: '#3d4f63', led: '#1f2a44', rim: '#4a3b2a' }[kind]
  const fg = {
    wheel: "<circle cx='20' cy='20' r='14' fill='none' stroke='%23cfd6de' stroke-width='4'/><circle cx='20' cy='20' r='4' fill='%23cfd6de'/><path d='M20 8v24M8 20h24' stroke='%23cfd6de' stroke-width='2'/>",
    shock: "<rect x='17' y='6' width='6' height='28' rx='3' fill='%23f9bf59'/><path d='M13 12h14M13 17h14M13 22h14M13 27h14' stroke='%23e7e9eb' stroke-width='2'/>",
    led: "<circle cx='20' cy='20' r='11' fill='%23fff7d6'/><circle cx='20' cy='20' r='6' fill='%23ffffff'/><path d='M4 20h4M32 20h4M20 4v4M20 32v4' stroke='%23fff7d6' stroke-width='2'/>",
    rim: "<circle cx='20' cy='20' r='14' fill='none' stroke='%23e0b070' stroke-width='5'/><circle cx='20' cy='20' r='3' fill='%23e0b070'/>",
  }[kind]
  return `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='${encodeURIComponent(bg)}'/%3E${fg.replace(/</g, '%3C').replace(/>/g, '%3E')}%3C/svg%3E`
}

// ── ตัวเลข ──
const baht = (n) => '฿' + Math.round(n).toLocaleString('en-US')
const baht2 = (n) => '฿' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
const num = (n) => n.toLocaleString('en-US')
const pct = (n, d = 2) => n.toFixed(d) + '%'
const DASH = '<span class="text-d500">—</span>'

// ── ข้อมูล: 8 แอดแรก = ของจริง (getAdSalesReport) · 4 แถวท้าย + spend ทุกแถว = ตัวอย่าง ──
const ADS = [
  { name: 'video 360_Group_1', id: '120214455102340219', img: 'wheel', chats: 651, orders: 180, sales: 74070, lost: 2, spend: 14820 },
  { name: 'โพสวิดีโอ คลิป 3_Group_1', id: '120214455102340301', img: 'shock', chats: 242, orders: 56, sales: 34610, lost: 2, spend: 9450 },
  { name: 'รวมโพส_Group_1', id: '120213987700120044', img: 'rim', chats: 247, orders: 38, sales: 23860, lost: 0, spend: 8920 },
  { name: 'โพสวิดีโอ แกนเงิน', id: '120214610055870112', img: 'shock', chats: 72, orders: 27, sales: 16490, lost: 0, spend: 3210 },
  { name: 'โพสวิดีโอ แกนทอง', id: '120214610055870113', img: 'rim', chats: 43, orders: 15, sales: 9830, lost: 0, spend: 2640 },
  { name: '290_Post_video_17 sec_Group_1', id: '120213458800120290', img: 'wheel', chats: 50, orders: 23, sales: 7480, lost: 1, spend: 2980 },
  { name: 'ADMD_Group_1', id: '120213458800120301', img: 'led', chats: 51, orders: 11, sales: 5190, lost: 0, spend: 3150 },
  { name: 'โพสแนวตั้ง', id: '120214777300450008', img: 'wheel', chats: 8, orders: 5, sales: 4160, lost: 0, spend: 620 },
  { name: 'โปรล้อแม็ก 11.11 วันเดียว ลด 40%', id: '120214901200330017', img: 'wheel', chats: 9, orders: 14, sales: 6240, lost: 0, spend: 2100 },
  { name: 'ไฟหน้า LED', id: '120214901200330021', img: null, chats: 5, orders: 9, sales: 3180, lost: 0, spend: 1050 },
  { name: null, id: '120213458800120219', img: null, chats: 0, orders: 4, sales: 1450, lost: 0, spend: 420 },
  { name: 'ล้อแม็กลดล้างสต็อก', id: '120214901200330035', img: 'rim', chats: 2, orders: 2, sales: 650, lost: 0, spend: 240 },
]
const sum = (k) => ADS.reduce((a, r) => a + r[k], 0)
const TOT = { chats: sum('chats'), orders: sum('orders'), sales: sum('sales'), lost: sum('lost'), spend: sum('spend') } // 1,380 · 384 · 187,210 · 5 · 49,600
const NONAD = { sales: 7902, orders: 17 }
const ALL = TOT.sales + NONAD.sales
const PREV = { sales: 166557, orders: 355, chats: 1262, spend: 40823 }
const delta = (cur, prev) => ((cur - prev) / prev) * 100
const adLabel = (a) => a.name ?? `รหัสโฆษณา ${a.id}`

// ซีรีส์รายวัน 30 วัน — ผลรวมเท่าการ์ดสรุปเป๊ะ (HR16: เส้นรายวันรวมกัน = ตัวเลขบนการ์ด)
const LABELS = [...Array(16)].map((_, i) => `${16 + i} ต.ค.`).concat([...Array(14)].map((_, i) => `${1 + i} พ.ย.`))
function spread(total, seed, amp = 0.35) {
  const w = LABELS.map((_, i) => Math.max(0.15, 1 + amp * Math.sin(i * 0.7 + seed) + 0.22 * Math.sin(i * 2.3 + seed * 2) + (i % 7 === 5 || i % 7 === 6 ? 0.25 : 0) + (i === 26 ? 0.9 : 0)))
  const W = w.reduce((a, b) => a + b, 0)
  const out = w.map((x) => Math.floor((x / W) * total))
  out[out.length - 1] += total - out.reduce((a, b) => a + b, 0)
  return out
}
const SER = {
  ad: spread(TOT.sales, 1), nonAd: spread(NONAD.sales, 3, 0.6), orders: spread(TOT.orders, 1.1),
  spend: spread(TOT.spend, 2, 0.15), prevAd: spread(PREV.sales, 4), prevOrders: spread(PREV.orders, 4.2),
}
SER.roas = SER.ad.map((s, i) => +(s / SER.spend[i]).toFixed(2))

// ── ชิ้นส่วน UI ──
const TONE = { primary: 'bg-primary15 text-primary-ink', danger: 'bg-danger15 text-danger-ink', success: 'bg-success15 text-success-ink', warning: 'bg-warning15 text-warning-ink', info: 'bg-info15 text-info-ink', neutral: 'bg-d200 text-d800' }
const badge = (tone, text, icon, cls = '') => `<span class="badge ${TONE[tone]} ${cls}">${icon ? IC(icon, 12) : ''}${text}</span>`
const sample = (needsAds) => `<span class="badge border border-dashed border-warning bg-warning15 text-warning-ink" title="ตัวเลขในการ์ดนี้เป็นตัวอย่าง ยังไม่มีข้อมูลจริง">${IC('flask', 12)}${needsAds ? 'ตัวอย่าง — ต้องเชื่อมบัญชีโฆษณา' : 'ตัวอย่าง'}</span>`
// up = ดีขึ้นไหม (ค่าโฆษณาขึ้นไม่ใช่ดี/ไม่ดี → neutral)
function deltaPill(d, { neutral = false, unit = '%' } = {}) {
  const up = d >= 0
  const tone = neutral ? 'neutral' : up ? 'success' : 'danger'
  return badge(tone, `${Math.abs(d).toFixed(unit === '%' ? 1 : 1)}${unit === '%' ? '%' : ' จุด'}`, up ? 'arrow-up' : 'arrow-down', 'text-xs')
}
const deltaText = (d, neutral = false) => `<span class="inline-flex items-center text-xs font-medium ${neutral ? 'text-d600' : d >= 0 ? 'text-success-ink' : 'text-danger-ink'}">${IC(d >= 0 ? 'arrow-up' : 'arrow-down', 12)}${Math.abs(d).toFixed(1)}%</span>`
const kicker = (t) => `<h4 class="mb-2.5 text-xs font-bold text-d500">${t}</h4>`
const iconDot = (i, bg) => `<span class="flex size-9 shrink-0 items-center justify-center rounded-full text-white" style="background:${bg}">${IC(i, 20)}</span>`
const thumb = (a, s = 'size-9') => a.img ? `<img src="${prodImg(a.img)}" alt="" class="${s} shrink-0 rounded object-cover" />` : `<span class="flex ${s} shrink-0 items-center justify-center rounded bg-d200 text-d600">${IC('speakerphone', 16)}</span>`
const bar = (w, color, h = 'h-1.25') => `<div class="${h} w-full overflow-hidden rounded-full bg-d200"><div class="h-full rounded-full" style="width:${w}%;background:${color}"></div></div>`
const card = (cls, header, body) => `<div class="card h-full ${cls}">${header ? `<div class="card-header">${header}</div>` : ''}${body}</div>`
const chartBox = (id, h) => `<div id="${id}" style="min-height:${h}px"></div>`

// สีกราฟ — แทนสีม่วงของธีม (chart-secondary/zeta) ด้วยน้ำเงิน/ฟ้า/เขียวอมฟ้า/เหลืองอำพัน
const C = { blue: '#236dc9', sky: '#1aa0e8', teal: '#02bc9c', amber: '#f9bf59', orange: '#ff8f1f' }
const cssv = (n) => getComputedStyle(document.documentElement).getPropertyValue('--' + n).trim()

// ── การ์ด ──
function cardAdSales(dev) {
  const d = delta(TOT.sales, PREV.sales)
  return card('', '', `<div class="card-body">
    ${kicker('ยอดขายจากโฆษณา')}
    <div class="mb-1 flex flex-wrap items-center gap-2.5">${iconDot('speakerphone', C.blue)}<h3 class="text-xl font-semibold tabular-nums text-d900">${baht(TOT.sales)}</h3>${deltaPill(d)}</div>
    <p class="text-xs text-d600">ช่วงก่อนหน้า ${baht(PREV.sales)} · ${TOT.orders} ใบ</p>
    ${chartBox(`c1-${dev.k}`, 230)}</div>`)
}
function cardShare(dev) {

    return `<div id="tbl-${dev.k}" class="card">${`<div class="card-header">${head}</div>`}<div class="card-body"><ul class="space-y-3">${rows.map(li).join('')}</ul></div>${foot}</div>`
  }
  const th = (t, sub) => `<th class="px-2 py-2.5 text-center align-bottom font-semibold">${t}${sub ? `<span class="block text-2xs font-normal text-d500">${sub}</span>` : ''}</th>`
  const tr = (a) => { const x = cells(a); return `<tr class="border-t border-d200 hover:bg-d100">
    <td class="max-w-0 py-2.5 pe-2 ps-5"><span class="flex min-w-0 items-center gap-2.5">${thumb(a)}<span class="min-w-0"><span class="block truncate font-medium text-d900" title="${adLabel(a)}">${adLabel(a)}</span><span class="block text-2xs tabular-nums text-d500">${a.id}</span></span></span></td>
    <td class="px-2 text-center tabular-nums text-d900">${num(a.chats)}</td>
    <td class="px-2 text-center tabular-nums"><span class="block text-d900">${a.orders}</span><span class="block text-2xs text-d600">${x.rate}</span></td>
    <td class="px-2 text-center tabular-nums"><span class="block font-semibold text-d900">${baht(a.sales)}</span><span class="block text-2xs text-d600">${x.avg}</span></td>
    <td class="px-2 text-center tabular-nums"><span class="block text-d900">${x.spend}</span><span class="block text-2xs text-d600">${x.cpo}</span></td>
    <td class="px-2 text-center font-semibold tabular-nums text-d900">${x.roas}</td>
    <td class="pe-5 ps-2 text-center tabular-nums ${a.lost ? 'text-d900' : 'text-d500'}">${a.lost}</td></tr>` }
  const T = { name: `รวม ${ADS.length} แอด`, id: '', img: 'x', chats: TOT.chats, orders: TOT.orders, sales: TOT.sales, spend: TOT.spend, lost: TOT.lost }
  const xt = cells(T)
  return `<div id="tbl-${dev.k}" class="card"><div class="card-header">${head}</div>
    <div class="overflow-x-auto"><table class="w-full table-fixed whitespace-nowrap text-sm">
      <colgroup><col style="width:${dev.k === 'd' ? 34 : 30}%"/><col/><col/><col/><col/><col/><col/></colgroup>
      <thead class="bg-d100 text-xs text-d700"><tr><th class="py-2.5 pe-2 ps-5 text-start align-bottom font-semibold">โฆษณา</th>${th('แชทจากโฆษณา')}${th('คำสั่งซื้อ', 'อัตราปิดการขาย')}${th('ยอดขาย', 'ยอดเฉลี่ยต่อใบ')}${th('ค่าโฆษณา', 'ต้นทุนต่อออเดอร์')}${th('ROAS')}${th('ยกเลิก/คืน')}</tr></thead>
      <tbody>${rows.map(tr).join('')}</tbody>
      <tfoot class="border-t-2 border-d300 bg-d50 font-semibold"><tr><td class="py-2.5 pe-2 ps-5 text-d900">รวม ${ADS.length} แอด</td><td class="px-2 text-center tabular-nums text-d900">${num(TOT.chats)}</td>
        <td class="px-2 text-center tabular-nums"><span class="block text-d900">${TOT.orders}</span><span class="block text-2xs font-normal text-d600">${xt.rate}</span></td>
        <td class="px-2 text-center tabular-nums"><span class="block text-d900">${baht(TOT.sales)}</span><span class="block text-2xs font-normal text-d600">${xt.avg}</span></td>
        <td class="px-2 text-center tabular-nums"><span class="block text-d900">${xt.spend}</span><span class="block text-2xs font-normal text-d600">${xt.cpo}</span></td>
        <td class="px-2 text-center tabular-nums text-d900">${xt.roas}</td><td class="pe-5 ps-2 text-center tabular-nums text-d900">${TOT.lost}</td></tr></tfoot>
    </table></div>${foot}</div>`
}

// ── หัวหน้า + กรอบ ──
const PERIODS = ['วันนี้', '7 วัน', '30 วัน', 'เดือนนี้', 'กำหนดเอง']
function controls(dev) {
  const m = dev.k === 'm', h = dev.k === 'd' ? '' : 'min-h-11'
  const seg = `<div class="seg flex ${m ? 'overflow-x-auto' : ''}" role="group" aria-label="ช่วงเวลา">${PERIODS.map((p, i) => `<button type="button" aria-pressed="${p === '30 วัน'}" class="shrink-0 whitespace-nowrap border border-d300 px-3 py-1.5 text-sm text-d800 ${h} ${i ? '-ms-px' : ''} ${i === 0 ? 'rounded-s' : ''} ${i === PERIODS.length - 1 ? 'rounded-e' : ''}">${p === 'กำหนดเอง' ? IC('calendar', 14) + ' ' : ''}${p}</button>`).join('')}</div>`
  const page = `<select class="form-select ${m ? 'flex-1' : 'w-40'} ${h}" aria-label="เพจ"><option>ทุกเพจ</option><option>ธนภัทร์ อะไหล่ซิ่ง</option><option>ธนภัทร์ ล้อแม็ก</option><option>thanapat.parts</option></select>`
  const exp = m ? `<button type="button" class="btn-icon size-11" aria-label="ส่งออก">${IC('download', 18)}</button>` : `<button type="button" class="btn border border-d300 text-d800 ${h}">${IC('download', 16)}ส่งออก</button>`
  return m ? `<div class="space-y-2">${seg}<div class="flex gap-2">${page}${exp}</div></div>` : `<div class="flex flex-wrap items-center gap-2">${seg}${page}${exp}</div>`
}
const rangeNote = `<p class="mt-1 text-xs text-d600">16 ต.ค. – 14 พ.ย. 2569 · เทียบกับ 16 ก.ย. – 15 ต.ค. 2569</p>`
const banner = (dev) => S.conn ? '' : `<div class="mb-5 flex flex-wrap items-center gap-3 rounded border border-info bg-info15 p-3.75">
  ${IC('plug-connected-x', 22, 'text-info-ink')}<div class="min-w-0 flex-1"><p class="font-semibold text-d900">ยังไม่ได้เชื่อมบัญชีโฆษณา Meta</p><p class="text-xs text-d700">ค่าโฆษณา · ROAS · ต้นทุนต่อออเดอร์ จะแสดงเมื่อเชื่อมบัญชีโฆษณา ส่วนยอดขายและคำสั่งซื้อจากโฆษณาดูได้ตามปกติ</p></div>
  <a href="#" class="btn bg-primary text-white ${dev.k === 'd' ? '' : 'min-h-11 w-full sm:w-auto'}">${IC('plug-connected', 16)}เชื่อมบัญชีโฆษณา</a></div>`
function sideNav() {
  const it = (i, l, a) => `<li class="flex items-center gap-2.5 rounded px-3 py-2 text-sm ${a ? 'bg-primary15 font-medium text-primary-ink' : 'text-d700'}">${IC(i, 18)}${l}</li>`
  return `<aside class="w-[260px] shrink-0 border-e border-d200 bg-card px-3 py-4">
    <div class="mb-4 px-3 text-lg font-bold text-d900">Deep</div>
    <p class="px-3 pb-1 text-2xs font-semibold text-d500">เมนูหลัก</p>
    <ul class="mb-3 space-y-0.5">${it('home', 'หน้าหลัก')}${it('message-circle', 'ข้อความ')}${it('shopping-cart', 'คำสั่งซื้อ')}${it('package', 'สินค้า')}${it('users', 'ลูกค้า')}</ul>
    <p class="px-3 pb-1 text-2xs font-semibold text-d500">รายงาน</p>
    <ul class="space-y-0.5">${it('chart-bar', 'ยอดขายรายสินค้า')}${it('speakerphone', 'ยอดขายตามโฆษณา', 1)}${it('report-money', 'กำไรขาดทุน')}</ul></aside>`
}
const BOTTOM = [['home', 'หน้าหลัก'], ['message-circle', 'แชท'], ['shopping-cart', 'ออเดอร์'], ['package', 'สินค้า'], ['menu-2', 'เมนู']]
function page(dev) {
  const k = dev.k
  const C1 = cardAdSales(dev), C2 = cardShare(dev), C3 = cardTopAds(dev), OV = cardOverview(dev), DN = cardDonut(dev)
  const PV = cardProvince(dev), CHN = cardChannel(dev), PG = cardPages(dev), TB = cardTable(dev)
  const g = (cls, items) => `<div class="mb-5 grid gap-5 [&>*]:min-w-0 ${cls}">${items.join('')}</div>`
  const sp = (n, x) => `<div class="${n}">${x}</div>`
  let grid
  if (k === 'd') grid = g('grid-cols-3', [C1, C2, C3]) + g('grid-cols-4', [sp('col-span-3', OV), DN]) + g('grid-cols-12', [sp('col-span-7', PV), sp('col-span-5', CHN)]) + g('grid-cols-4', [PG, sp('col-span-3', TB)])
  else if (k === 't') grid = g('grid-cols-2', [C1, C2, sp('col-span-2', C3), sp('col-span-2', OV), DN, PG, sp('col-span-2', PV), sp('col-span-2', CHN), sp('col-span-2', TB)])
  else grid = g('grid-cols-1 gap-4', [C1, C2, C3, OV, DN, PV, CHN, PG, TB])
  if (k === 'd') {
    return `<div class="flex">${sideNav()}<div class="min-w-0 flex-1">
      <div class="flex h-[65px] items-center border-b border-d200 bg-card px-5">${IC('menu-2', 20, 'text-d700')}<span class="ms-auto flex items-center gap-4">${IC('bell', 20, 'text-d700')}<img src="${photo(30)}" alt="" class="size-8 rounded-full" /></span></div>
      <div class="p-5"><div class="mb-5 flex flex-wrap items-end justify-between gap-4"><div><nav aria-label="breadcrumb" class="mb-1 flex items-center gap-1.25 text-xs font-medium text-d600">หน้าหลัก ${IC('chevron-right', 12)} รายงาน ${IC('chevron-right', 12)} <span class="text-d700">ยอดขายตามโฆษณา</span></nav><h3 class="text-lg font-semibold text-d900">ยอดขายตามโฆษณา</h3>${rangeNote}</div>${controls(dev)}</div>
      ${banner(dev)}${grid}</div></div></div>`
  }
  return `<div class="flex min-h-14 items-center gap-2 border-b border-d200 bg-card px-2"><button type="button" aria-label="ย้อนกลับ" class="flex size-11 items-center justify-center text-d700">${IC('arrow-left', 20)}</button><span class="text-md font-semibold text-d900">ยอดขายตามโฆษณา</span></div>
    <div class="p-4"><div class="mb-4">${controls(dev)}${rangeNote}</div>${banner(dev)}${grid}</div>
    <nav class="grid h-[72px] grid-cols-5 items-center border-t border-d200 bg-card">${BOTTOM.map(([i, l]) => `<span class="flex flex-col items-center gap-0.5 text-2xs ${l === 'เมนู' ? 'font-medium text-primary-ink' : 'text-d600'}">${IC(i, 22)}${l}</span>`).join('')}</nav>`
}
function frame(dev, inner) {
  return `<div class="shrink-0"><div class="mb-2 flex items-center gap-2 text-xs font-semibold text-d700">${IC(dev.k === 'm' ? 'device-mobile' : dev.k === 't' ? 'device-tablet' : 'device-desktop', 16)}${dev.label}</div><div class="frame" style="width:${dev.w}px">${inner}</div></div>`
}

// ── กราฟ (ApexCharts — ของจริงใช้ ApexChart wrapper + getColor('chart-*')) ──
let CHARTS = []
function base(type, h) {
  return {
    chart: { type, height: h, toolbar: { show: false }, fontFamily: 'Anuphan, sans-serif', foreColor: cssv('d600'), background: 'transparent', animations: { enabled: false } },
    grid: { borderColor: cssv('d200'), strokeDashArray: 4, padding: { top: -10, right: 0, bottom: -6, left: 6 } },
    dataLabels: { enabled: false }, legend: { show: false },
    tooltip: { theme: document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light', shared: true, intersect: false },
    xaxis: { categories: LABELS, tickAmount: 6, labels: { rotate: 0, style: { fontSize: '11px' } }, axisBorder: { show: false }, axisTicks: { show: false } },
  }
}
const kfmt = (v) => (v >= 1000 ? '฿' + (v / 1000).toFixed(v >= 10000 ? 0 : 1) + 'k' : '฿' + Math.round(v))
function drawCharts() {
  CHARTS.forEach((c) => c.destroy()); CHARTS = []
  const mk = (id, o) => { const el = document.getElementById(id); if (el) { const c = new ApexCharts(el, o); c.render(); CHARTS.push(c) } }
  for (const dev of DEVS) {
    const k = dev.k, m = k === 'm'
    // การ์ด 1 — แท่งซ้อนรายวัน
    mk(`c1-${k}`, { ...base('bar', 230), chart: { ...base('bar', 230).chart, stacked: true },
      series: [{ name: 'จากโฆษณา', data: SER.ad }, { name: 'ไม่ได้มาจากโฆษณา', data: SER.nonAd }],
      colors: [C.blue, C.amber], plotOptions: { bar: { columnWidth: '55%', borderRadius: 2 } },
      legend: { show: true, position: 'bottom', fontSize: '12px', markers: { size: 5 } },
      yaxis: { labels: { formatter: kfmt, style: { fontSize: '11px' } }, tickAmount: 3 },
      xaxis: { ...base('bar', 0).xaxis, tickAmount: m ? 4 : 6, labels: { ...base('bar', 0).xaxis.labels, hideOverlappingLabels: true } },
      tooltip: { ...base('bar', 0).tooltip, y: { formatter: (v) => baht(v) } } })
    // แถวที่ 2 — เส้นรายวันตามแท็บ
    const t = S.tab[k]
    if (!(['spend', 'roas'].includes(t) && !S.conn)) {
      const o = { ...base('area', 300), stroke: { width: [2, 2], dashArray: [0, 5], curve: 'smooth' },
        fill: { type: ['gradient', 'solid'], opacity: [1, 0], gradient: { opacityFrom: 0.35, opacityTo: 0, stops: [0, 95] } },
        legend: { show: true, position: 'top', horizontalAlign: 'right', fontSize: '12px', markers: { size: 5 } } }
      if (t === 'sales') Object.assign(o, { series: [{ name: 'ยอดขายจากโฆษณา', data: SER.ad }, { name: 'ช่วงก่อนหน้า', data: SER.prevAd }], colors: [C.blue, '#9aa2aa'], yaxis: { min: 0, tickAmount: 3, labels: { formatter: kfmt } }, tooltip: { ...o.tooltip, y: { formatter: (v) => baht(v) } } })
      if (t === 'orders') Object.assign(o, { series: [{ name: 'คำสั่งซื้อจากโฆษณา', data: SER.orders }, { name: 'ช่วงก่อนหน้า', data: SER.prevOrders }], colors: [C.blue, '#9aa2aa'], yaxis: { min: 0, tickAmount: 3, labels: { formatter: (v) => Math.round(v) } } })
      if (t === 'spend') Object.assign(o, { series: [{ name: 'ยอดขายจากโฆษณา', type: 'area', data: SER.ad }, { name: 'ค่าโฆษณา', type: 'line', data: SER.spend }], stroke: { width: [2, 3], dashArray: [0, 0], curve: 'smooth' }, colors: [C.blue, C.orange], yaxis: { min: 0, tickAmount: 3, labels: { formatter: kfmt } }, tooltip: { ...o.tooltip, y: { formatter: (v) => baht(v) } } })
      if (t === 'roas') Object.assign(o, { chart: { ...o.chart, type: 'line' }, series: [{ name: 'ROAS รายวัน', data: SER.roas }], stroke: { width: 3, curve: 'smooth' }, fill: { type: 'solid', opacity: 1 }, colors: [C.teal], yaxis: { min: 0, tickAmount: 3, labels: { formatter: (v) => v.toFixed(1) } },
        annotations: { yaxis: [{ y: 1, borderColor: C.orange, strokeDashArray: 4, label: { text: 'ROAS 1 = ยอดขายเท่าค่าโฆษณา', position: 'left', textAnchor: 'start', style: { background: C.orange, color: '#fff', fontFamily: 'Anuphan' } } }] } })
      if (m) o.xaxis = { ...o.xaxis, tickAmount: 4 }
      mk(`c4-${k}`, o)
    }
    // ข้าง — donut
    const D = donutData()
    mk(`c5-${k}`, { chart: { type: 'donut', height: 180, fontFamily: 'Anuphan, sans-serif', foreColor: cssv('d600'), animations: { enabled: false } }, series: D.series, labels: D.labels, colors: D.colors, legend: { show: false }, stroke: { width: 0 }, dataLabels: { enabled: false },
      tooltip: { y: { formatter: (v) => baht(v) } },
      plotOptions: { pie: { donut: { size: '75%', labels: { show: true, name: { fontSize: '12px' }, value: { fontSize: '16px', fontWeight: 600, color: cssv('d900'), formatter: (v) => baht(+v) }, total: { show: true, showAlways: true, label: 'ยอดจากโฆษณา', fontSize: '12px', color: cssv('d600'), formatter: () => baht(TOT.sales) } } } } } })
  }
}

// ── วาด ──
function render() {
  document.getElementById('app').innerHTML = `<section>
    <h2 class="mb-1 text-lg font-bold text-d900">/reports/ads — แดชบอร์ด ${S.conn ? '(เชื่อมบัญชีโฆษณาแล้ว)' : '(ยังไม่เชื่อมบัญชีโฆษณา)'}</h2>
    <ul class="mb-4 max-w-[1500px] list-disc ps-5 text-xs text-d700">
      <li>โครง 4 แถวลอกจาก <code>theme/paces/.../dashboard/analytics/page.tsx</code> · ตัวเลือกช่วงเวลา <b>ตัวเดียวบนหัวหน้า</b> แทน select ต่อการ์ดของธีม — ทุกตัวเลขในหน้าใช้ช่วงเดียวกัน</li>
      <li>ป้าย <b>"ตัวอย่าง"</b> = ตัวเลขสมมติ (ยังไม่มีตัวคำนวณ) · <b>"ตัวอย่าง — ต้องเชื่อมบัญชีโฆษณา"</b> = ต้องดึงค่าโฆษณาจาก Meta Insights · การ์ดที่ไม่มีป้าย = ตัวเลขจริงจาก getAdSalesReport (ร้านธนภัทร์)</li>
      <li>สลับ "ยังไม่เชื่อมบัญชีโฆษณา" ที่แถบบน เพื่อดูแบนเนอร์ + ช่องการตลาดเป็น "—" · แท็บ KPI กดได้ทุกจอ</li>
    </ul>
    <div class="space-y-10">${DEVS.map((d) => frame(d, page(d))).join('')}</div></section>`
  document.querySelectorAll('[data-kpi]').forEach((b) => b.addEventListener('click', () => { S.tab[b.dataset.dev] = b.dataset.kpi; render() }))
  // Tailwind CDN สร้าง CSS หลัง DOM เปลี่ยน — รอให้ layout นิ่งก่อนวัดความกว้างกราฟ
  setTimeout(drawCharts, 120)
}
document.querySelectorAll('[data-conn]').forEach((b) => b.addEventListener('click', () => {
  S.conn = b.dataset.conn === '1'
  document.querySelectorAll('[data-conn]').forEach((x) => x.setAttribute('aria-selected', String(x === b)))
  render()
}))
document.getElementById('themeBtn').addEventListener('click', () => {
  const h = document.documentElement
  h.dataset.theme = h.dataset.theme === 'dark' ? 'light' : 'dark'
  drawCharts()
})
render()
</script>
</body>
</html>
